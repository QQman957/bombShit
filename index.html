/* 通关动画：冒着金光的巨型屎从马桶里冲出来 → wink → 张嘴吐出「恭喜通关」 */
function drawVictory(g, t) {
  const T = victoryT;
  const ease = x => 1 - Math.pow(1 - x, 3);
  const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  // 背景压暗
  g.fillStyle = 'rgba(6,14,20,' + (clamp(T / 0.8, 0, 1) * 0.64) + ')';
  g.fillRect(0, 0, W, H);

  const rise = ease(clamp(T / 1.05, 0, 1));
  const px = W / 2, py = lerp(MUZZLE.y - 6, 258, rise);
  const S = lerp(0.16, 1, rise) * 82;

  // 从马桶口冲出的金色光柱
  const beam = clamp(T / 0.7, 0, 1) * clamp((3.6 - T) / 1.2, 0, 1);
  if (beam > 0.01) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const bg2 = g.createLinearGradient(0, MUZZLE.y, 0, 40);
    bg2.addColorStop(0, 'rgba(255,216,96,' + (0.34 * beam) + ')');
    bg2.addColorStop(1, 'rgba(255,216,96,0)');
    g.fillStyle = bg2;
    g.beginPath();
    g.moveTo(MUZZLE.x - 44, MUZZLE.y);
    g.lineTo(MUZZLE.x - 200, 40);
    g.lineTo(MUZZLE.x + 200, 40);
    g.lineTo(MUZZLE.x + 44, MUZZLE.y);
    g.closePath(); g.fill();
    g.restore();
  }

  // 光晕 + 旋转光芒
  if (rise > 0.02) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const pulse = 0.72 + 0.28 * Math.sin(T * 6);
    const halo = g.createRadialGradient(px, py, S * 0.3, px, py, S * 3.1);
    halo.addColorStop(0, 'rgba(255,234,146,' + (0.52 * rise * pulse) + ')');
    halo.addColorStop(0.45, 'rgba(255,198,64,' + (0.22 * rise * pulse) + ')');
    halo.addColorStop(1, 'rgba(255,180,40,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(px, py, S * 3.1, 0, TAU); g.fill();
    g.translate(px, py); g.rotate(T * 0.5);
    for (let i = 0; i < 12; i++) {
      g.rotate(TAU / 12);
      const rg = g.createLinearGradient(0, 0, S * 2.8, 0);
      rg.addColorStop(0, 'rgba(255,238,158,' + (0.20 * rise) + ')');
      rg.addColorStop(1, 'rgba(255,238,158,0)');
      g.fillStyle = rg;
      g.beginPath();
      g.moveTo(0, -S * 0.13); g.lineTo(S * 2.8, 0); g.lineTo(0, S * 0.13);
      g.closePath(); g.fill();
    }
    g.restore();
  }

  /* ---- 巨型屎本体 ---- */
  const wink = T > 1.15 && T < 1.78;
  const mouthOpen = clamp((T - V_MOUTH_AT) / 0.32, 0, 1);
  const bob = Math.sin(T * 2.2) * 3 * rise;

  g.save();
  g.translate(px, py + bob);
  softShadow(g, 6, S * 1.10, S * 1.0, S * 0.30, 0.22, '30,50,62');

  bigPoopPath(g, S);
  const pg = g.createLinearGradient(-S * 1.1, -S * 1.2, S * 0.9, S * 1.1);
  pg.addColorStop(0, '#ffeaa0');
  pg.addColorStop(0.26, '#f6c53c');
  pg.addColorStop(0.58, '#c9901a');
  pg.addColorStop(1, '#7a5406');
  g.fillStyle = pg; g.fill();
  g.lineWidth = Math.max(2, S * 0.09);
  g.strokeStyle = '#5d3f04'; g.stroke();
  g.save();
  bigPoopPath(g, S); g.clip();

  // 层与层之间的压痕 —— 让三段结构读得出来，不然整团糊成一个色块
  g.strokeStyle = 'rgba(92,62,5,0.42)';
  g.lineWidth = S * 0.075; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-S * 0.99, S * 0.10);
  g.quadraticCurveTo(0, S * 0.44, S * 0.99, S * 0.10);
  g.stroke();
  g.beginPath();
  g.moveTo(-S * 0.80, -S * 0.52);
  g.quadraticCurveTo(0, -S * 0.20, S * 0.80, -S * 0.52);
  g.stroke();
  // 每层上沿的亮边
  g.strokeStyle = 'rgba(255,246,196,0.50)';
  g.lineWidth = S * 0.055;
  g.beginPath();
  g.moveTo(-S * 0.92, S * 0.02);
  g.quadraticCurveTo(0, S * 0.34, S * 0.92, S * 0.02);
  g.stroke();
  g.beginPath();
  g.moveTo(-S * 0.74, -S * 0.60);
  g.quadraticCurveTo(0, -S * 0.29, S * 0.74, -S * 0.60);
  g.stroke();

  // 顶面高光
  const hl = g.createRadialGradient(-S * 0.34, -S * 0.58, 1, -S * 0.34, -S * 0.58, S * 0.8);
  hl.addColorStop(0, 'rgba(255,255,238,0.78)');
  hl.addColorStop(1, 'rgba(255,255,238,0)');
  g.fillStyle = hl;
  g.beginPath(); g.arc(-S * 0.34, -S * 0.58, S * 0.8, 0, TAU); g.fill();
  // 左下暗部，增加体积
  const sh2 = g.createRadialGradient(S * 0.55, S * 0.55, 1, S * 0.45, S * 0.45, S * 1.3);
  sh2.addColorStop(0, 'rgba(70,44,2,0.30)');
  sh2.addColorStop(1, 'rgba(70,44,2,0)');
  g.fillStyle = sh2;
  g.beginPath(); g.arc(S * 0.45, S * 0.45, S * 1.3, 0, TAU); g.fill();
  g.restore();

  /* ---- 脸 ---- */
  const ex = S * 0.32, ey = -S * 0.48, er = S * 0.19;
  const eye = (cx, closed) => {
    if (closed) {
      g.strokeStyle = '#3a2404'; g.lineWidth = S * 0.085; g.lineCap = 'round';
      g.beginPath();
      g.arc(cx, ey + er * 0.42, er * 0.95, Math.PI * 1.15, Math.PI * 1.85);
      g.stroke();
      return;
    }
    g.beginPath(); g.ellipse(cx, ey, er, er * 1.08, 0, 0, TAU);
    g.fillStyle = '#fffdf4'; g.fill();
    g.strokeStyle = '#3a2404'; g.lineWidth = S * 0.05; g.stroke();
    g.beginPath(); g.arc(cx + er * 0.16, ey + er * 0.10, er * 0.48, 0, TAU);
    g.fillStyle = '#241503'; g.fill();
    g.beginPath(); g.arc(cx - er * 0.26, ey - er * 0.34, er * 0.20, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.95)'; g.fill();
  };
  eye(-ex, wink);   // 左边 wink
  eye(ex, false);

  // 嘴
  const mw = lerp(S * 0.15, S * 0.42, mouthOpen);
  const mh = lerp(S * 0.045, S * 0.34, mouthOpen);
  const my2 = -S * 0.02;
  g.beginPath(); g.ellipse(0, my2, mw, mh, 0, 0, TAU);
  g.fillStyle = '#3d1206'; g.fill();
  g.strokeStyle = '#5d3f04'; g.lineWidth = S * 0.05; g.stroke();
  if (mouthOpen > 0.15) {
    g.beginPath(); g.ellipse(0, my2 + mh * 0.45, mw * 0.60, mh * 0.42, 0, 0, TAU);
    g.fillStyle = '#c0506a'; g.fill();
  }
  g.restore();

  /* ---- 四个大字从嘴里喷出来 ---- */
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let i = 0; i < 4; i++) {
    const k = clamp((T - (V_CHAR_AT + i * V_CHAR_GAP)) / 0.50, 0, 1);
    if (k <= 0) continue;
    const eb = back(k);
    const sx = px, sy = py - S * 0.02;
    const tx2 = W / 2 + (i - 1.5) * 158, ty2 = 456;
    const cx2 = lerp(sx, tx2, eb);
    const cy2 = lerp(sy, ty2, eb) - Math.sin(k * Math.PI) * 64;
    const sc2 = lerp(0.22, 1, eb);
    g.save();
    g.globalAlpha = clamp(k / 0.22, 0, 1);
    g.translate(cx2, cy2);
    g.rotate((1 - eb) * (i % 2 ? 0.55 : -0.55));
    g.scale(sc2, sc2);
    g.font = '800 100px "Segoe UI","Microsoft YaHei",sans-serif';
    g.lineWidth = 14; g.lineJoin = 'round';
    g.strokeStyle = '#6b4a04';
    g.strokeText(VICTORY_TEXT[i], 0, 0);
    const tg = g.createLinearGradient(0, -52, 0, 52);
    tg.addColorStop(0, '#fff8cc'); tg.addColorStop(0.5, '#ffd23d'); tg.addColorStop(1, '#df9a0e');
    g.fillStyle = tg;
    g.fillText(VICTORY_TEXT[i], 0, 0);
    g.restore();
  }
  g.textBaseline = 'alphabetic';

  // 金色星尘
  if (T > V_CHAR_AT && Math.random() < 0.45) {
    particles.push({
      x: px + rand(-150, 150), y: py + rand(-60, 100),
      vx: rand(-40, 40), vy: rand(-130, -45), r: rand(1.6, 3.6),
      life: 1.1, max: 1.1, col: 'rgba(255,224,124,0.9)', grav: -30,
      gas: false, spin: 0, rot: 0
    });
  }
}

function drawClear(g) {  g.fillStyle = 'rgba(4,12,17,0.62)';
  g.fillRect(0, 0, W, H);
  const pw = 620, ph = 448, qx = (W - pw) / 2, qy = (H - ph) / 2 - 6;
  panel(g, qx, qy, pw, ph);
  g.textAlign = 'center';
  g.font = '800 44px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = '#7fe0a8';
  g.fillText('过 关 !', W / 2, qy + 66);
  g.font = '800 18px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.72)';
  g.fillText('第 ' + (levelIndex + 1) + ' 关 · ' + Lv().name, W / 2, qy + 98);
  drawStars(g, W / 2, qy + 166, clearStars, clearAt);
  g.font = '800 19px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.86)';
  g.fillText('得分 ' + score + '　·　发射 ' + shots + ' 坨　·　命中率 ' + (shots ? Math.round(hits / shots * 100) : 0) + '%', W / 2, qy + 232);

  const last = levelIndex >= LEVELS.length - 1;
  if (last) {
    const total = stars.reduce((a, b) => a + b, 0);
    g.font = '800 22px "Segoe UI","Microsoft YaHei",sans-serif';
    g.fillStyle = '#ffd766';
    g.fillText('🎉 全部通关！共 ' + total + ' / ' + (LEVELS.length * 3) + ' 星', W / 2, qy + 272);
  }
  const byy = qy + 300;
  if (!last) {
    button(g, W / 2 - 190, byy, 380, 56, '下 一 关 →', null, () => startLevel(levelIndex + 1), true);
    button(g, W / 2 - 186, byy + 68, 182, 48, '重 玩', null, () => startLevel(levelIndex));
    button(g, W / 2 + 4, byy + 68, 182, 48, '选 关', null, () => { scene = 'select'; });
  } else {
    button(g, W / 2 - 190, byy, 380, 56, '重 玩 本 关', null, () => startLevel(levelIndex), true);
    button(g, W / 2 - 96, byy + 68, 192, 48, '选 关', null, () => { scene = 'select'; });
  }
}

function drawFail(g) {
  g.fillStyle = 'rgba(4,12,17,0.64)';
  g.fillRect(0, 0, W, H);
  const pw = 580, ph = 372, qx = (W - pw) / 2, qy = (H - ph) / 2 - 6;
  panel(g, qx, qy, pw, ph);
  const gs = goalState();
  g.textAlign = 'center';
  g.font = '800 46px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = '#ff8a6b';
  g.fillText('时 间 到', W / 2, qy + 78);
  g.font = '800 19px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.82)';
  g.fillText('第 ' + (levelIndex + 1) + ' 关 · ' + Lv().name, W / 2, qy + 116);
  g.font = '800 24px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = '#ffd766';
  g.fillText(gs.label + '  ' + gs.cur + ' / ' + gs.need + gs.unit, W / 2, qy + 164);
  g.font = '16px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.62)';
  g.fillText('得分 ' + score + '　·　命中率 ' + (shots ? Math.round(hits / shots * 100) : 0) + '%', W / 2, qy + 200);
  g.font = '14px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,200,150,0.8)';
  g.fillText('提示：' + Lv().tip, W / 2, qy + 238);
  button(g, W / 2 - 178, qy + 266, 168, 54, '再 试 一 次', null, () => startLevel(levelIndex), true);
  button(g, W / 2 + 10, qy + 266, 168, 54, '选 关', null, () => { scene = 'select'; });
}

/* ============================================================
   输入
   ============================================================ */
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.unlock();
  const p = toLogical(e.clientX, e.clientY);
  mouse = p;
  if (scene !== 'playing') {
    for (const r of hitRects) {
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { r.action(); return; }
    }
    if (scene === 'menu') scene = 'select';
    return;
  }
  try { cvs.setPointerCapture(e.pointerId); } catch (er) {}
  if (suppress) return;
  const dx = p.x - MUZZLE.x, dy = p.y - MUZZLE.y;
  if (dx * dx + dy * dy > 100) aim = clampAim(Math.atan2(dy, dx), dx);
  charging = true; chargeT = 0;
});
cvs.addEventListener('pointermove', e => {
  const p = toLogical(e.clientX, e.clientY);
  mouse = p;
  const dx = p.x - MUZZLE.x, dy = p.y - MUZZLE.y;
  if (dx * dx + dy * dy < 400) return;
  if (scene === 'playing' || scene === 'menu') aim = clampAim(Math.atan2(dy, dx), dx);
});
function release() {
  if (scene === 'playing' && charging && !suppress) fire();
  charging = false; chargeT = 0;
}
cvs.addEventListener('pointerup', e => { e.preventDefault(); suppress = false; release(); });
cvs.addEventListener('pointercancel', () => { suppress = false; release(); });
window.addEventListener('blur', () => { suppress = false; release(); });

const keys = {};
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    Sound.unlock();
    if (scene === 'playing' && !charging && !suppress) { charging = true; chargeT = 0; }
    return;
  }
  if (e.code === 'Escape') {
    if (scene === 'playing') { release(); scene = 'select'; }
    else if (scene === 'select') scene = 'menu';
    else if (scene === 'clear' || scene === 'fail') scene = 'select';
    return;
  }
  if (e.key === 'm' || e.key === 'M') {
    const m = Sound.toggle();
    if (scene === 'playing') popText(W / 2, H / 2, m ? '🔇 静音' : '🔊 开声', '#fff', 26);
  }
  keys[e.key] = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { e.preventDefault(); release(); return; }
  keys[e.key] = false;
});

/* ============================================================
   主循环
   ============================================================ */
let last = performance.now(), tAcc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 20) dt = 1 / 20;
  tAcc += dt;

  if (scene === 'playing') {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) aim = clampAim(aim - dt * 1.6, -1);
    if (keys['ArrowRight'] || keys['d'] || keys['D']) aim = clampAim(aim + dt * 1.6, 1);
  }

  if (hitstop > 0) hitstop -= dt;
  else update(dt);

  render(tAcc);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 自动化测试钩子 ---------- */
window.__PT = {
  scene: () => scene,
  level: () => levelIndex,
  levelCount: LEVELS.length,
  score: () => score,
  hits: () => hits,
  shots: () => shots,
  combo: () => maxCombo,
  comboNow: () => combo,
  comboTimer: () => +comboTimer.toFixed(3),
  time: () => timeLeft,
  stars: () => stars.slice(),
  goal: () => goalState(),
  flies: () => flies.length,
  flyList: () => flies.map(f => ({ x: Math.round(f.x), y: Math.round(f.y), vx: Math.round(f.vx), vy: Math.round(f.vy) })),
  shots3: () => shots3.length,
  hazards: () => hazards.length,
  hazardList: () => hazards.map(h => ({ x: Math.round(h.x), y: Math.round(h.y), r: 34 })),
  aim: () => +aim.toFixed(4),
  charging: () => charging,
  frenzy: () => +frenzy.toFixed(3),
  frenzyActive: () => frenzy > 0,
  frenzyCount: () => frenzyCount,
  fireCd: () => +fireCd.toFixed(3),
  forceCombo: n => { combo = n; comboTimer = 2.6; },
  // ---- Boss / 血量 / 黄金装扮 ----
  boss: () => (boss ? {
    hp: +boss.hp.toFixed(1), maxHp: boss.maxHp,
    x: Math.round(boss.x), y: Math.round(boss.y),
    enrage: !!boss.enrage, r: boss.r,
    tier: boss.tier, taunt: +boss.taunt.toFixed(2), tauntText: boss.tauntText
  } : null),
  forceTaunt: () => { if (boss) { boss.taunt = 2.4; boss.tauntText = '就这？'; } },
  frozen: () => toiletFrozen(),
  bossPhase: () => (boss ? boss.phase : 'none'),
  splitTimer: () => (boss ? +boss.splitTimer.toFixed(2) : 0),
  forceSplit: () => { if (boss) { boss.hp = SPLIT_AT_HP; enterSplitPhase(); } },
  splitConst: () => ({ at: SPLIT_AT_HP, count: SPLIT_COUNT, time: SPLIT_TIME, heal: SPLIT_HEAL }),
  forceMinions: n => spawnMinions(n),
  victoryActive: () => victoryActive,
  victoryT: () => +victoryT.toFixed(2),
  skipVictory: () => { victoryT = V_END + 1; },
  setVictoryT: v => { victoryT = v; },
  forceVictory: () => { scene = 'clear'; victoryActive = true; victoryT = 0; clearStars = 3; clearAt = performance.now(); },
  victoryTimings: () => ({ mouth: V_MOUTH_AT, char: V_CHAR_AT, gap: V_CHAR_GAP, end: +V_END.toFixed(2) }),
  bossShots: () => bossShots.length,
  bossShotPos: () => bossShots.map(s => ({ x: Math.round(s.x), y: Math.round(s.y) })),
  paintBossShot: () => { bossFire(); return bossShots.length; },
  playerHP: () => playerHP,
  playerMaxHP: () => PLAYER_HP,
  bossIntroDone: () => bossIntro <= 0,
  skipBossIntro: () => { bossIntro = 0; },
  goldUnlocked: () => goldUnlocked(),
  goldSkin: () => goldSkin,
  setGoldSkin: v => setGoldSkin(v),
  setStars: arr => { for (let i = 0; i < stars.length; i++) stars[i] = arr[i] | 0; },
  levelInfo: i => {
    const L = LEVELS[i];
    return { name: L.name, time: L.time, spd: L.spd, spawn: L.spawn, haz: L.haz, wind: L.wind, noFrenzy: !!L.noFrenzy, boss: !!L.boss, goal: L.goal.type };
  },
  start: i => startLevel(i),
  crosshair: () => ({ x: Math.round(mouse.x), y: Math.round(mouse.y) }),
  // 镜中倒影位置：供测试校验方向
  mirrorOf: (x, y) => ({
    x: Math.round(VP.x + (x - VP.x) * MIRROR_K),
    y: Math.round(VP.y + (y - VP.y) * MIRROR_K)
  }),
  mirrorRect: () => ({ x: 838, y: 116, w: 292, h: 236 }),
  projPos: () => shots3.map(p => ({ x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 })),
  // 直接注入一只苍蝇 / 发一炮，用于确定性测试
  clearFlies: () => { flies.length = 0; },
  clearOne: () => { flies.pop(); },
  // 音效自检：每个音效都必须扛得住「漏传参数 / 传 NaN」，
  // 否则 setValueAtTime 会抛 non-finite 并中断整条音效链
  soundTest: () => {
    Sound.fart(); Sound.fart(NaN); Sound.fart(undefined); Sound.fart(Infinity); Sound.fart(0.5); Sound.fart(-3);
    Sound.hit(); Sound.hit(true); Sound.hit(NaN);
    Sound.splat(); Sound.charge(); Sound.win(); Sound.flush(); Sound.frenzy(); Sound.hurt();
    return true;
  },
  addFly: (x, y) => {
    spawnFly();
    const f = flies[flies.length - 1];
    f.x = x; f.y = y; f.vx = 0; f.vy = 0; f.speed = 0; f.spawn = 1;
    return flies.length - 1;
  },
  shoot: (dx, dy, power) => {
    if (toiletFrozen()) return -1;          // 和真实开火走同一套规则
    const len = Math.hypot(dx, dy) || 1;
    const sp = chargeSpeed(power === undefined ? 0.5 : power);
    shots3.push({
      x: MUZZLE.x, y: MUZZLE.y,
      vx: dx / len * sp, vy: dy / len * sp,
      r: 17, rot: 0, vr: 0, bounces: 0, trail: 0, power: power || 0
    });
    shots++;
    return shots3.length - 1;
  }
};

})();
</script>
