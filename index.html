(() => {
'use strict';

/* ============================================================
   🚽 屎马桶炮 —— 精致二维版
   ------------------------------------------------------------
   全部用 Canvas2D 矢量绘制：多层渐变、接触阴影、镜面反射、
   挤压拉伸、命中顿帧。没有一张外部贴图。
   ============================================================ */

const W = 1280, H = 720;
const FLOOR = 600;                 // 地平线（墙脚）
const VP = { x: 640, y: 250 };     // 地板透视消失点
const MIRROR_K = 0.72;             // 倒影的透视压缩系数（压向消失点）
const MUZZLE = { x: 640, y: 462 }; // 炮口＝马桶盆口
const MAX_TIME_DEFAULT = 60;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

function rr(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function poly(g, p) {
  g.beginPath();
  g.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
  g.closePath();
}
function starPath(g, cx, cy, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.44 : r;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
/* 软阴影：径向渐变椭圆，比 shadowBlur 快得多也柔和得多 */
function softShadow(g, x, y, rx, ry, alpha, col) {
  const grd = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
  grd.addColorStop(0, 'rgba(' + (col || '40,60,72') + ',' + alpha + ')');
  grd.addColorStop(1, 'rgba(' + (col || '40,60,72') + ',0)');
  g.save();
  g.translate(x, y);
  g.scale(1, ry / Math.max(rx, ry));
  g.translate(-x, -y);
  g.fillStyle = grd;
  g.beginPath();
  g.arc(x, y, Math.max(rx, ry), 0, TAU);
  g.fill();
  g.restore();
}

/* ============================================================
   视口
   ============================================================ */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  cvs.width = Math.round(cw * dpr);
  cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  const scale = Math.min(cw / W, ch / H);
  view = { scale, ox: (cw - W * scale) / 2, oy: (ch - H * scale) / 2, dpr };
}
window.addEventListener('resize', resize);
resize();
function toLogical(cx, cy) {
  const r = cvs.getBoundingClientRect();
  return { x: (cx - r.left - view.ox) / view.scale, y: (cy - r.top - view.oy) / view.scale };
}

/* ============================================================
   音效（程序化合成）
   ============================================================ */
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.34;
    master.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 1.2);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function ok() {
    init();
    if (!ac) return false;
    if (ac.state === 'suspended') ac.resume();
    return !muted;
  }
  function fart(power) {
    if (!ok()) return;
    // 防御：漏传 / 传 NaN 都会让 setValueAtTime 抛 "non-finite value" 并中断整个音效
    power = (typeof power === 'number' && isFinite(power)) ? clamp(power, 0, 1.2) : 0.5;
    const t = ac.currentTime, dur = 0.30 + power * 0.12;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
    bp.frequency.setValueAtTime(300 + power * 220, t);
    bp.frequency.exponentialRampToValueAtTime(95 + power * 45, t + dur);
    const lfo = ac.createOscillator(); lfo.type = 'sine';
    lfo.frequency.setValueAtTime(26, t);
    lfo.frequency.linearRampToValueAtTime(14, t + dur);
    const lg = ac.createGain(); lg.gain.value = 70;
    lfo.connect(lg).connect(bp.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 0.03);
    g.gain.setValueAtTime(0.55, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(master);
    lfo.start(t); lfo.stop(t + dur + 0.05);
    src.start(t); src.stop(t + dur + 0.05);
    const sub = ac.createOscillator(); sub.type = 'sine';
    sub.frequency.setValueAtTime(140 + power * 60, t);
    sub.frequency.exponentialRampToValueAtTime(55, t + dur * 0.9);
    const sg = ac.createGain();
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.9);
    sub.connect(sg).connect(master);
    sub.start(t); sub.stop(t + dur);
  }
  function splat() {
    if (!ok()) return;
    const t = ac.currentTime, dur = 0.16;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2600, t);
    lp.frequency.exponentialRampToValueAtTime(260, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.40, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp).connect(g).connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function hit(gold) {
    if (!ok()) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(gold ? 700 : 520, t);
    o.frequency.exponentialRampToValueAtTime(gold ? 1800 : 1180, t + 0.13);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.2);
  }
  function charge() {
    if (!ok()) return;
    const t = ac.currentTime, dur = 0.5;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(70, t);
    o.frequency.linearRampToValueAtTime(230, t + dur);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp).connect(g).connect(master);
    o.start(t); o.stop(t + dur);
  }
  function win() {
    if (!ok()) return;
    const t0 = ac.currentTime;
    [523, 659, 784, 1046].forEach((f, i) => {
      const off = i * 0.13;
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f, t0 + off);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.20, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.30);
      o.connect(g).connect(master);
      o.start(t0 + off); o.stop(t0 + off + 0.34);
    });
  }
  function frenzy() {
    if (!ok()) return;
    const t0 = ac.currentTime;
    // 上行琶音 + 一层上扬的噪声扫频，听感上是「火力全开」
    [392, 523, 659, 880, 1175].forEach((f, i) => {
      const off = i * 0.055;
      const o = ac.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(f, t0 + off);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.11, t0 + off + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.20);
      o.connect(g).connect(master);
      o.start(t0 + off); o.stop(t0 + off + 0.24);
    });
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(500, t0);
    bp.frequency.exponentialRampToValueAtTime(4200, t0 + 0.42);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.14, t0 + 0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.46);
    src.connect(bp).connect(g2).connect(master);
    src.start(t0); src.stop(t0 + 0.5);
  }
  function hurt() {
    if (!ok()) return;
    const t = ac.currentTime, dur = 0.42;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(210, t);
    o.frequency.exponentialRampToValueAtTime(58, t + dur);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1100, t);
    lp.frequency.exponentialRampToValueAtTime(240, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function flush() {
    if (!ok()) return;
    const t = ac.currentTime, dur = 0.7;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1400, t);
    lp.frequency.linearRampToValueAtTime(420, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp).connect(g).connect(master);
    src.start(t); src.stop(t + dur + 0.05);
  }
  return {
    fart, splat, hit, charge, win, flush, frenzy, hurt,
    unlock: init,
    toggle() { muted = !muted; return muted; },
    isMuted() { return muted; }
  };
})();

/* ============================================================
   背景（一次性预渲染）
   ============================================================ */
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
(function paintRoom() {
  const g = bg.getContext('2d');
  g.lineJoin = 'round';

  /* ---- 墙 ---- */
  let grd = g.createLinearGradient(0, 0, 0, FLOOR);
  grd.addColorStop(0, '#e6f5fe');
  grd.addColorStop(0.55, '#c8e4f4');
  grd.addColorStop(1, '#a9cfe4');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, FLOOR);

  /* ---- 瓷砖：每块都有独立的高光与内阴影 ---- */
  const T = 96;
  for (let y = 0; y < FLOOR; y += T) {
    for (let x = 0; x < W; x += T) {
      const w = Math.min(T, W - x), h = Math.min(T, FLOOR - y);
      g.fillStyle = 'rgba(255,255,255,' + (0.05 + ((x * 7 + y * 13) % 5) * 0.012) + ')';
      g.fillRect(x, y, w, h);
      g.strokeStyle = 'rgba(255,255,255,0.75)';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(x + 1, y + h - 1); g.lineTo(x + 1, y + 1); g.lineTo(x + w - 1, y + 1); g.stroke();
      g.strokeStyle = 'rgba(140,175,195,0.30)';
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x + w - 1, y + 1); g.lineTo(x + w - 1, y + h - 1); g.lineTo(x + 1, y + h - 1); g.stroke();
    }
  }

  /* ---- 天花板灯：光锥 ---- */
  (function lamp() {
    const lx = 640, ly = 26;
    const cone = g.createLinearGradient(0, ly, 0, FLOOR);
    cone.addColorStop(0, 'rgba(255,248,226,0.20)');
    cone.addColorStop(0.55, 'rgba(255,248,226,0.05)');
    cone.addColorStop(1, 'rgba(255,246,214,0)');
    g.save();
    g.beginPath();
    g.moveTo(lx - 74, ly);
    g.lineTo(lx + 74, ly);
    g.lineTo(lx + 300, FLOOR);
    g.lineTo(lx - 300, FLOOR);
    g.closePath();
    g.fillStyle = cone;
    g.fill();
    g.restore();

    const glow = g.createRadialGradient(lx, ly + 20, 4, lx, ly + 20, 190);
    glow.addColorStop(0, 'rgba(255,248,220,0.42)');
    glow.addColorStop(1, 'rgba(255,248,220,0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(lx, ly + 20, 150, 0, TAU); g.fill();

    // 灯罩
    g.beginPath();
    g.moveTo(lx - 78, ly - 4);
    g.bezierCurveTo(lx - 74, ly + 34, lx + 74, ly + 34, lx + 78, ly - 4);
    g.closePath();
    const sh = g.createLinearGradient(lx - 78, 0, lx + 78, 0);
    sh.addColorStop(0, '#e6dcc0');
    sh.addColorStop(0.4, '#fffdf4');
    sh.addColorStop(1, '#d9cfae');
    g.fillStyle = sh; g.fill();
    g.strokeStyle = 'rgba(170,160,130,0.7)'; g.lineWidth = 2; g.stroke();
  })();

  /* ---- 窗户 ---- */
  (function window_() {
    const x = 118, y = 92, w = 258, h = 246;
    // 窗框外沿 + 台面光溢出
    g.save();
    const spill = g.createRadialGradient(x + w / 2, y + h / 2, 40, x + w / 2, y + h / 2, 330);
    spill.addColorStop(0, 'rgba(190,232,255,0.42)');
    spill.addColorStop(1, 'rgba(190,232,255,0)');
    g.fillStyle = spill;
    g.beginPath(); g.arc(x + w / 2, y + h / 2, 330, 0, TAU); g.fill();
    g.restore();

    rr(g, x - 14, y - 14, w + 28, h + 28, 10);
    g.fillStyle = '#ffffff'; g.fill();
    g.strokeStyle = 'rgba(150,180,198,0.55)'; g.lineWidth = 2; g.stroke();

    const ix = x, iy = y, iw = w, ih = h;
    g.save();
    rr(g, ix, iy, iw, ih, 4);
    g.clip();
    const sky = g.createLinearGradient(0, iy, 0, iy + ih);
    sky.addColorStop(0, '#7cc6f2');
    sky.addColorStop(0.6, '#bfe6fb');
    sky.addColorStop(1, '#e8f6ff');
    g.fillStyle = sky;
    g.fillRect(ix, iy, iw, ih);
    // 云
    g.fillStyle = 'rgba(255,255,255,0.92)';
    const clouds = [[0.24, 0.30, 46, 20], [0.42, 0.42, 34, 15], [0.72, 0.24, 40, 17], [0.60, 0.62, 30, 13]];
    clouds.forEach(c => {
      const cx = ix + c[0] * iw, cy = iy + c[1] * ih;
      g.beginPath();
      g.ellipse(cx, cy, c[2], c[3], 0, 0, TAU);
      g.ellipse(cx + c[2] * 0.7, cy + c[3] * 0.4, c[2] * 0.65, c[3] * 0.8, 0, 0, TAU);
      g.ellipse(cx - c[2] * 0.65, cy + c[3] * 0.3, c[2] * 0.55, c[3] * 0.75, 0, 0, TAU);
      g.fill();
    });
    // 玻璃反光
    g.fillStyle = 'rgba(255,255,255,0.16)';
    poly(g, [ix, iy + ih, ix + iw * 0.55, iy, ix + iw * 0.78, iy, ix + iw * 0.22, iy + ih]);
    g.fill();
    g.restore();

    // 窗棂
    g.strokeStyle = '#ffffff'; g.lineWidth = 11;
    g.beginPath(); g.moveTo(ix + iw / 2, iy); g.lineTo(ix + iw / 2, iy + ih); g.stroke();
    g.beginPath(); g.moveTo(ix, iy + ih * 0.46); g.lineTo(ix + iw, iy + ih * 0.46); g.stroke();
    g.strokeStyle = 'rgba(160,190,208,0.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(ix + iw / 2 + 6, iy); g.lineTo(ix + iw / 2 + 6, iy + ih); g.stroke();
    g.beginPath(); g.moveTo(ix, iy + ih * 0.46 + 6); g.lineTo(ix + iw, iy + ih * 0.46 + 6); g.stroke();

    rr(g, ix, iy, iw, ih, 4);
    g.strokeStyle = 'rgba(160,190,208,0.8)'; g.lineWidth = 3; g.stroke();

    // 窗台
    rr(g, x - 26, y + h + 14, w + 52, 16, 6);
    const sill = g.createLinearGradient(0, y + h + 14, 0, y + h + 30);
    sill.addColorStop(0, '#ffffff'); sill.addColorStop(1, '#dbe6ec');
    g.fillStyle = sill; g.fill();
    g.strokeStyle = 'rgba(150,180,198,0.55)'; g.lineWidth = 2; g.stroke();
    softShadow(g, x + w / 2, y + h + 34, w * 0.62, 10, 0.22);
  })();

  /* ---- 洗手盆 ---- */
  (function sink() {
    const cx = 250, top = 400;
    softShadow(g, cx, FLOOR - 8, 130, 22, 0.26);
    // 立柱
    g.beginPath();
    g.moveTo(cx - 52, top + 44);
    g.bezierCurveTo(cx - 44, top + 130, cx - 58, FLOOR - 26, cx - 66, FLOOR);
    g.lineTo(cx + 66, FLOOR);
    g.bezierCurveTo(cx + 58, FLOOR - 26, cx + 44, top + 130, cx + 52, top + 44);
    g.closePath();
    const ped = g.createLinearGradient(cx - 66, 0, cx + 66, 0);
    ped.addColorStop(0, '#dfe8ed'); ped.addColorStop(0.34, '#ffffff');
    ped.addColorStop(0.72, '#f0f5f8'); ped.addColorStop(1, '#c9d6dd');
    g.fillStyle = ped; g.fill();
    g.strokeStyle = 'rgba(150,178,192,0.7)'; g.lineWidth = 2.5; g.stroke();
    // 盆
    g.beginPath();
    g.moveTo(cx - 118, top);
    g.bezierCurveTo(cx - 116, top + 60, cx - 62, top + 78, cx, top + 78);
    g.bezierCurveTo(cx + 62, top + 78, cx + 116, top + 60, cx + 118, top);
    g.closePath();
    const basin = g.createLinearGradient(cx - 118, 0, cx + 118, 0);
    basin.addColorStop(0, '#e3ecf1'); basin.addColorStop(0.32, '#ffffff');
    basin.addColorStop(0.7, '#f3f8fa'); basin.addColorStop(1, '#c6d3da');
    g.fillStyle = basin; g.fill();
    g.strokeStyle = 'rgba(150,178,192,0.7)'; g.lineWidth = 2.5; g.stroke();
    // 盆口
    g.beginPath();
    g.ellipse(cx, top, 118, 26, 0, 0, TAU);
    g.fillStyle = '#ffffff'; g.fill();
    g.strokeStyle = 'rgba(150,178,192,0.7)'; g.lineWidth = 2.5; g.stroke();
    g.beginPath();
    g.ellipse(cx, top + 2, 96, 18, 0, 0, TAU);
    const inner = g.createLinearGradient(0, top - 16, 0, top + 20);
    inner.addColorStop(0, '#8ba3b0'); inner.addColorStop(1, '#5f7683');
    g.fillStyle = inner; g.fill();
    // 龙头
    g.beginPath();
    g.moveTo(cx, top - 6); g.lineTo(cx, top - 62);
    g.bezierCurveTo(cx, top - 84, cx + 22, top - 84, cx + 22, top - 66);
    g.lineWidth = 11; g.lineCap = 'round';
    g.strokeStyle = '#c8d5dc'; g.stroke();
    g.lineWidth = 5; g.strokeStyle = '#eef4f7'; g.stroke();
    g.beginPath();
    g.ellipse(cx, top - 6, 22, 8, 0, 0, TAU);
    g.fillStyle = '#b9c8d0'; g.fill();
  })();

  /* ---- 镜子（金属框 + 玻璃渐变） ---- */
  (function mirror() {

function updateFlies(dt) {
  for (const f of flies) {
    f.spawn += dt;
    f.t -= dt;
    if (f.t <= 0) { f.t = rand(0.5, 1.4); f.targA = Math.random() * TAU; }
    const k = Math.min(1, dt * 2.6);
    f.vx += (Math.cos(f.targA) * f.speed - f.vx) * k;
    f.vy += (Math.sin(f.targA) * f.speed * 0.62 - f.vy) * k;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 120) { f.x = 120; f.targA = Math.PI - f.targA; }
    if (f.x > W - 120) { f.x = W - 120; f.targA = Math.PI - f.targA; }
    if (f.y < 96) { f.y = 96; f.targA = -f.targA; }
    if (f.y > 432) { f.y = 432; f.targA = -f.targA; }
    f.wing += dt * 58;
    f.tilt = clamp(f.vx / 620, -0.42, 0.42);
  }
}
/* at 用于画镜中倒影：给定位置与额外缩放，不再做上下翻转 */
function drawFly(g, f, at) {
  const extra = at ? at.sc : 1;
  const sc = Math.min(1, f.spawn * 4) * extra;
  g.save();
  g.translate(at ? at.x : f.x, at ? at.y : f.y);
  g.scale(sc, sc);
  g.rotate(f.tilt);

  const R = f.r * 0.52;   // 翅展约 5.5R ≈ 66px，和碰撞半径解耦
  const dark = f.golden ? '#8a6208' : '#20262b';
  const body = f.golden ? '#f0b429' : '#464e54';
  const lite = f.golden ? '#ffe08a' : '#79858d';

  // 触角
  g.strokeStyle = dark; g.lineWidth = 1.6; g.lineCap = 'round';
  for (const s of [-1, 1]) {
    g.beginPath();
    g.moveTo(s * 5, -R * 1.02);
    g.quadraticCurveTo(s * 12, -R * 1.5, s * 19, -R * 1.34);
    g.stroke();
  }

  // 六足
  g.strokeStyle = dark; g.lineWidth = 2.1;
  for (let i = 0; i < 3; i++) {
    for (const s of [-1, 1]) {
      const by = -R * 0.30 + i * R * 0.46;
      g.beginPath();
      g.moveTo(s * R * 0.44, by);
      g.quadraticCurveTo(s * R * 1.25, by + R * 0.34, s * R * 1.05, by + R * 1.15);
      g.stroke();
    }
  }

  // 腹部（分节条纹）
  g.beginPath();
  g.ellipse(0, R * 0.30, R * 0.78, R * 0.94, 0, 0, TAU);
  const ab = g.createLinearGradient(-R, 0, R, 0);
  ab.addColorStop(0, lite); ab.addColorStop(0.45, body); ab.addColorStop(1, dark);
  g.fillStyle = ab; g.fill();
  g.strokeStyle = dark; g.lineWidth = 1.6; g.stroke();
  g.save();
  g.beginPath(); g.ellipse(0, R * 0.30, R * 0.78, R * 0.94, 0, 0, TAU); g.clip();
  g.strokeStyle = f.golden ? 'rgba(120,84,0,0.5)' : 'rgba(8,12,15,0.45)';
  g.lineWidth = 2;
  for (let i = -1; i <= 2; i++) {
    g.beginPath();
    g.moveTo(-R, R * 0.30 + i * R * 0.40);
    g.lineTo(R, R * 0.30 + i * R * 0.40);
    g.stroke();
  }
  // 背部高光
  g.beginPath();
  g.ellipse(-R * 0.30, R * 0.04, R * 0.22, R * 0.52, -0.3, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.30)';
  g.fill();
  g.restore();

  // 胸腔
  g.beginPath();
  g.ellipse(0, -R * 0.26, R * 0.66, R * 0.62, 0, 0, TAU);
  const th = g.createLinearGradient(-R * 0.7, -R, R * 0.7, R * 0.2);
  th.addColorStop(0, lite); th.addColorStop(0.55, body); th.addColorStop(1, dark);
  g.fillStyle = th; g.fill();
  g.strokeStyle = dark; g.lineWidth = 1.6; g.stroke();

  // 翅膀（半透明 + 翅脉）
  const flap = Math.sin(f.wing) * 0.5 + 0.5;
  for (const s of [-1, 1]) {
    g.save();
    g.translate(s * R * 0.24, -R * 0.54);
    g.rotate(s * (-0.32 + flap * 0.62));
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(s * R * 1.15, -R * 0.60, s * R * 2.35, -R * 0.32, s * R * 2.75, R * 0.14);
    g.bezierCurveTo(s * R * 2.20, R * 0.34, s * R * 1.00, R * 0.34, 0, 0);
    g.closePath();
    const wg = g.createLinearGradient(0, 0, s * R * 2.7, 0);
    wg.addColorStop(0, 'rgba(226,244,252,0.62)');
    wg.addColorStop(0.6, 'rgba(198,230,246,0.42)');
    wg.addColorStop(1, 'rgba(176,214,236,0.26)');
    g.fillStyle = wg; g.fill();
    g.strokeStyle = 'rgba(120,160,182,0.55)'; g.lineWidth = 1.1; g.stroke();
    g.strokeStyle = 'rgba(140,180,200,0.38)'; g.lineWidth = 0.9;
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      g.beginPath();
      g.moveTo(s * R * 0.18, R * 0.04);
      g.quadraticCurveTo(s * R * 1.5, -R * 0.16 + t * R * 0.30, s * R * (2.1 + t * 0.5), R * (0.02 + t * 0.10));
      g.stroke();
    }
    g.restore();
  }

  // 头 + 复眼
  g.beginPath();
  g.ellipse(0, -R * 0.86, R * 0.60, R * 0.50, 0, 0, TAU);
  g.fillStyle = dark; g.fill();
  for (const s of [-1, 1]) {
    g.beginPath();
    g.ellipse(s * R * 0.30, -R * 0.92, R * 0.30, R * 0.38, s * 0.25, 0, TAU);
    const eg = g.createRadialGradient(s * R * 0.24, -R * 1.02, 1, s * R * 0.30, -R * 0.92, R * 0.42);
    if (f.golden) { eg.addColorStop(0, '#6b5200'); eg.addColorStop(1, '#2a1e00'); }
    else { eg.addColorStop(0, '#e0564a'); eg.addColorStop(1, '#7a1d18'); }
    g.fillStyle = eg; g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.9; g.stroke();
    g.beginPath();
    g.arc(s * R * 0.24, -R * 1.06, R * 0.07, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.fill();
  }
  if (f.golden) {
    g.beginPath();
    g.ellipse(0, 0, R * 1.7, R * 1.2, 0, 0, TAU);
    const gg = g.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 1.7);
    gg.addColorStop(0, 'rgba(255,214,102,0.30)');
    gg.addColorStop(1, 'rgba(255,214,102,0)');
    g.fillStyle = gg; g.fill();
  }
  g.restore();
}

/* ============================================================
   屎 —— 盘绕造型 + 速度拉伸
   ============================================================ */
function poopPath(g, s) {
  g.beginPath();
  g.moveTo(0, -s * 1.18);
  g.bezierCurveTo(s * 0.58, -s * 1.30, s * 0.78, -s * 0.64, s * 1.02, -s * 0.44);
  g.bezierCurveTo(s * 1.20, -s * 0.16, s * 0.90, s * 0.46, s * 0.44, s * 0.66);
  g.bezierCurveTo(s * 0.22, s * 1.00, -s * 0.22, s * 1.00, -s * 0.44, s * 0.66);
  g.bezierCurveTo(-s * 0.90, s * 0.46, -s * 1.20, -s * 0.16, -s * 1.02, -s * 0.44);
  g.bezierCurveTo(-s * 0.78, -s * 0.64, -s * 0.58, -s * 1.30, 0, -s * 1.18);
  g.closePath();
}
/* 三层经典屎造型：给通关动画用的大号版本。
   poopPath 是单瓣团块，放大后像鸡蛋，所以这里单独描一条轮廓。 */
function bigPoopPath(g, s) {
  g.beginPath();
  g.moveTo(-s * 1.10, s * 0.78);
  g.bezierCurveTo(-s * 1.26, s * 0.34, -s * 1.00, s * 0.10, -s * 0.70, s * 0.06);
  g.bezierCurveTo(-s * 0.98, -s * 0.10, -s * 0.88, -s * 0.44, -s * 0.52, -s * 0.54);
  g.bezierCurveTo(-s * 0.74, -s * 0.74, -s * 0.58, -s * 1.02, -s * 0.14, -s * 1.18);
  g.bezierCurveTo(-s * 0.02, -s * 1.34, s * 0.08, -s * 1.26, s * 0.12, -s * 1.14);
  g.bezierCurveTo(s * 0.48, -s * 1.04, s * 0.64, -s * 0.80, s * 0.52, -s * 0.54);
  g.bezierCurveTo(s * 0.88, -s * 0.44, s * 0.98, -s * 0.10, s * 0.70, s * 0.06);
  g.bezierCurveTo(s * 1.00, s * 0.10, s * 1.26, s * 0.34, s * 1.10, s * 0.78);
  g.bezierCurveTo(s * 0.70, s * 0.98, -s * 0.70, s * 0.98, -s * 1.10, s * 0.78);
  g.closePath();
}
function drawPoop(g, x, y, s, rot, stretch, alpha) {
  g.save();
  g.translate(x, y);
  if (alpha !== undefined) g.globalAlpha = alpha;
  g.rotate(rot);
  if (stretch && stretch > 1.001) g.scale(1 / Math.sqrt(stretch), stretch);

  // 落地/自身阴影
  g.save();
  g.translate(s * 0.14, s * 0.20);
  poopPath(g, s);
  g.fillStyle = 'rgba(36,20,9,0.34)';
  g.fill();
  g.restore();

  poopPath(g, s);
  const grd = g.createLinearGradient(-s * 1.1, -s * 1.2, s * 0.9, s * 1.1);
  grd.addColorStop(0, '#a06b3d');
  grd.addColorStop(0.30, '#7d4e2b');
  grd.addColorStop(0.66, '#5d3a1f');
  grd.addColorStop(1, '#37200f');
  g.fillStyle = grd;
  g.fill();
  g.lineWidth = Math.max(1.2, s * 0.16);
  g.strokeStyle = '#2f1b0c';
  g.stroke();

  // 盘绕纹
  g.save();
  poopPath(g, s);
  g.clip();
  g.lineWidth = Math.max(1.4, s * 0.20);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,214,170,0.26)';
  g.beginPath();
  g.moveTo(-s * 0.78, s * 0.06);
  g.bezierCurveTo(-s * 0.20, -s * 0.72, s * 0.42, s * 0.16, s * 0.80, -s * 0.38);
  g.stroke();
  g.strokeStyle = 'rgba(30,16,6,0.30)';
  g.beginPath();
  g.moveTo(-s * 0.86, s * 0.42);
  g.bezierCurveTo(-s * 0.24, -s * 0.26, s * 0.36, s * 0.56, s * 0.86, s * 0.04);
  g.stroke();
  // 顶面高光
  const hl = g.createRadialGradient(-s * 0.34, -s * 0.58, 1, -s * 0.34, -s * 0.58, s * 0.62);
  hl.addColorStop(0, 'rgba(255,240,214,0.55)');
  hl.addColorStop(1, 'rgba(255,240,214,0)');
  g.fillStyle = hl;
  g.beginPath(); g.arc(-s * 0.34, -s * 0.58, s * 0.62, 0, TAU); g.fill();
  g.restore();

  g.restore();
}

/* ============================================================
   粒子 / 飘字
   ============================================================ */
function burst(x, y, n, opt) {
  opt = opt || {};
  const cols = opt.colors || ['#a06b3d', '#7d4e2b', '#4a2c17'];
  for (let i = 0; i < n; i++) {
    const a = opt.dir !== undefined ? opt.dir + rand(-0.95, 0.95) : rand(0, TAU);
    const sp = rand(opt.spMin || 80, opt.spMax || 380);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.lift || 0),
      r: rand(opt.rMin || 2.6, opt.rMax || 8),
      life: rand(0.38, 1.05), max: 1,
      col: cols[(Math.random() * cols.length) | 0],
      grav: opt.grav === undefined ? 1400 : opt.grav, gas: false, spin: rand(-8, 8), rot: rand(0, TAU)
    });
  }
  for (const p of particles) p.max = p.life;
}
function puff(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(24, 110);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      r: rand(9, 22), life: rand(0.5, 1.05), max: 1,
      col: 'rgba(236,242,245,0.5)', grav: -60, gas: true, spin: 0, rot: 0
    });
  }
}
function popText(x, y, text, color, size) {
  pops.push({ x, y, text, color, life: 0.95, max: 0.95, vy: -78, size: size || 28 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if (p.gas) { p.vx *= 0.965; p.vy *= 0.965; p.r += dt * 30; }
    if (p.y > FLOOR && !p.gas) { p.y = FLOOR; p.vy *= -0.34; p.vx *= 0.68; }
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const q = pops[i];
    q.life -= dt;
    q.y += q.vy * dt;
    q.vy *= 0.93;
    if (q.life <= 0) pops.splice(i, 1);
  }
}

/* ============================================================
   开火
   ============================================================ */
function chargeSpeed(p) { return 580 + p * 900; }
/* 嘲讽期间马桶被冻住：不能蓄力也不能开炮 */
const toiletFrozen = () => !!(boss && boss.taunt > 0 && boss.phase !== 'split' && boss.hp > 0);
function fire(powerOverride) {
  if (toiletFrozen()) return;
  const power = powerOverride !== undefined ? powerOverride : clamp(chargeT, 0, 1);
  const sp = chargeSpeed(power);
  shots3.push({
    x: MUZZLE.x + Math.cos(aim) * 46,
    y: MUZZLE.y + Math.sin(aim) * 46,
    vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp,
    r: 15 + power * 4, rot: rand(0, TAU), vr: rand(-11, 11),
    bounces: 0, trail: 0, power
  });
  shots++;
  shake = Math.max(shake, 7 + power * 12);
  recoil = 1; muzzleGlow = 1; waterRipple = 1;
  Sound.fart(power);
  const mx = MUZZLE.x + Math.cos(aim) * 44, my = MUZZLE.y + Math.sin(aim) * 44;
  puff(mx, my, 9);
  burst(mx, my, 12, { dir: aim, spMin: 100, spMax: 380, rMin: 2, rMax: 6.5, grav: 900 });
}
/* 连击达标就开狂射；神射手关禁用 */
function frenzyOnHit() {
  if (Lv().noFrenzy) return;
  if (combo < FRENZY_AT) return;
  if (frenzy <= 0) {
    frenzy = FRENZY_TIME;
    frenzyCount++;
    flash = 1; flashColor = '255,190,60';
    popText(MUZZLE.x, MUZZLE.y - 150, '🔥 狂 射 模 式 !', '#ffd23d', 40);
    Sound.frenzy();
  } else {
    frenzy = Math.min(FRENZY_TIME + 1.5, frenzy + FRENZY_EXT);
  }
}
function killFly(f) {
  const base = f.golden ? 300 : 100;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  comboTimer = 2.2;
  frenzyOnHit();

  const mult = (1 + Math.floor(combo / 3)) * (frenzy > 0 ? 2 : 1);
  const gain = base * mult;
  score += gain; hits++;
  if (f.golden) {
    goldHits++;
    timeLeft = Math.min(Lv().time, timeLeft + 1.5);
    flash = Math.max(flash, 0.85); flashColor = '255,205,80';
    burst(f.x, f.y, 30, { colors: ['#ffe08a', '#f0b429', '#fff6d0'], spMin: 140, spMax: 520, rMin: 2.4, rMax: 8 });
    hitstop = 0.075;
  } else {
    burst(f.x, f.y, 20, { spMin: 100, spMax: 420, rMin: 2.6, rMax: 7.5 });
    hitstop = 0.045;
  }
  Sound.hit(f.golden);
  shake = Math.max(shake, f.golden ? 15 : 9);
  popText(f.x, f.y - 26, '+' + gain + (mult > 1 ? '  x' + mult : ''), f.golden ? '#ffd23d' : '#ffffff', f.golden ? 32 : 27);
}

/* ---------- Boss ---------- */
/* ---------- 强制分裂阶段 ---------- */
function enterSplitPhase() {
  if (!boss || boss.phase === 'split') return;
  boss.phase = 'split';
  boss.splitTimer = SPLIT_TIME;
  boss.taunt = 0;
  bossShots.length = 0;                       // 清场，别让玩家一边躲弹一边清小怪
  spawnMinions(SPLIT_COUNT);
  flash = 1; flashColor = '150,220,255';
  shake = Math.max(shake, 24);
  hitstop = 0.16;
  popText(W / 2, 320, '⚡ 强 制 分 裂 !', '#9fd0ff', 44);
  Sound.frenzy();
}
function endSplitPhase(heal) {
  if (!boss) return;
  boss.phase = 'normal';
  boss.atkCd = rand(1.6, 2.4);
  if (heal) {
    const alive = flies.length;
    if (alive > 0) {
      const amt = alive * SPLIT_HEAL;
      boss.hp = Math.min(boss.maxHp, boss.hp + amt);
      bossFlash = 1;
      popText(boss.x, boss.y - 70, '回 血 +' + amt + '  (' + alive + ' 只没清掉)', '#ff5a4a', 34);
    }
    flies.length = 0;                         // 剩下的苍蝇回到 Boss 身上
    shake = Math.max(shake, 16);
  } else {
    popText(W / 2, 320, '分 裂 解 除 !', '#7fe0a8', 40);
  }
  burst(boss.x, boss.y, 26,
    { colors: ['#8fd06a', '#5a8f3c', '#e8f7c8'], spMin: 130, spMax: 460, rMin: 2.6, rMax: 8 });
}
function hitBoss(power) {
  if (!boss || boss.hp <= 0) return;

  // 分裂阶段 Boss 免疫 —— 必须先把小苍蝇清干净
  if (boss.phase === 'split') {
    popText(boss.x, boss.y - 86, '免 疫 !', '#9fd0ff', 26);
    Sound.splat();
    return;
  }

  const dmg = Math.round(6 + power * 10);
  boss.hp = Math.max(0, boss.hp - dmg);
  boss.hurt = 1;
  bossFlash = 1;
  if (boss.hp <= boss.maxHp * 0.45) boss.enrage = 1;

  combo++;
  if (combo > maxCombo) maxCombo = combo;
  comboTimer = 2.2;
  frenzyOnHit();

  const mult = (1 + Math.floor(combo / 3)) * (frenzy > 0 ? 2 : 1);
  const gain = dmg * 10 * mult;
  score += gain; hits++;
  burst(boss.x + rand(-70, 70), boss.y + rand(-50, 50), 20,
    { colors: ['#8fd06a', '#4f7a34', '#e8f7c8'], spMin: 110, spMax: 420, rMin: 2.6, rMax: 8 });
  Sound.hit(false);
  shake = Math.max(shake, 14);
  hitstop = 0.05;
  popText(boss.x, boss.y - 80, '-' + dmg + (mult > 1 ? '  x' + mult : ''), '#ffb27a', 30);

  // 血量台阶 → 分裂小苍蝇
  const frac = boss.hp / boss.maxHp;
  const want = frac <= 0.25 ? 3 : frac <= 0.5 ? 2 : frac <= 0.75 ? 1 : 0;
  while (boss.tier < want) { boss.tier++; spawnMinions(boss.tier + 1); }

  // 残血 → 强制分裂
  if (boss.hp > 0 && boss.hp <= SPLIT_AT_HP) { enterSplitPhase(); return; }

  if (boss.hp <= 0) {
    // 爆浆
    flash = 1; flashColor = '255,220,120';
    shake = 34; hitstop = 0.22;
    for (let i = 0; i < 5; i++) {
      burst(boss.x + rand(-90, 90), boss.y + rand(-70, 70), 22,
        { colors: ['#8fd06a', '#c9e89a', '#5a8f3c', '#fff6d0'], spMin: 160, spMax: 620, rMin: 3, rMax: 11 });
    }
    Sound.win();
  }
}
function damagePlayer() {
  if (playerHP <= 0) return;
  playerHP--;
  shake = Math.max(shake, 26);
  flash = 1; flashColor = '255,80,60';
  hitstop = 0.12;
  burst(MUZZLE.x, MUZZLE.y, 26,
    { colors: ['#c0392b', '#8b1a10', '#e74c3c'], spMin: 120, spMax: 470, rMin: 3, rMax: 9 });
  popText(MUZZLE.x, MUZZLE.y - 110, '-1 ❤', '#ff6b5a', 34);
  Sound.hurt();
  if (playerHP <= 0) { playerHP = 0; finishLevel(false); }
}
function bossFire() {
  if (!boss) return;
  // 35% 故意打偏，剩下的朝马桶招呼 —— 玩家可以选择拦截
  const wide = Math.random() < 0.28;
  const off = wide ? rand(230, 400) * (Math.random() < 0.5 ? -1 : 1) : rand(-110, 110);
  const tx = MUZZLE.x + off, ty = MUZZLE.y - 20;
  const dx = tx - boss.x, dy = ty - (boss.y + 40);
  const d = Math.hypot(dx, dy) || 1;
  const sp = 430;
  bossShots.push({
    x: boss.x, y: boss.y + 40,
    vx: dx / d * sp, vy: dy / d * sp,
    r: 17, rot: 0, spin: rand(-6, 6), trail: 0
  });
  Sound.splat();
}
function updateBoss(dt) {
  if (!boss) return;
  const b = boss;
  b.t += dt;
  b.wing += dt * (b.enrage ? 30 : 20);
  if (bossIntro > 0) bossIntro = Math.max(0, bossIntro - dt);
  if (b.hurt > 0) b.hurt = Math.max(0, b.hurt - dt * 3);
  if (bossFlash > 0) bossFlash = Math.max(0, bossFlash - dt * 4);

  const spd = b.enrage ? 1.8 : 1.0;
  b.x += b.vx * spd * dt;
  if (b.x < 210) { b.x = 210; b.vx = Math.abs(b.vx); }
  if (b.x > W - 210) { b.x = W - 210; b.vx = -Math.abs(b.vx); }
  b.y = 282 + Math.sin(b.t * 1.5) * 24;

  if (bossIntro <= 0 && b.hp > 0) {
    if (b.phase === 'split') {
      // 分裂阶段：Boss 不攻击不嘲讽，只等玩家清小怪
      b.splitTimer -= dt;
      if (flies.length === 0) endSplitPhase(false);
      else if (b.splitTimer <= 0) endSplitPhase(true);
    } else {
      // 嘲讽期间马桶被冻住，这时 Boss 也停手（它正忙着嘲笑你），否则太不讲理
      const mocking = b.taunt > 0;
      if (!mocking) {
        b.atkCd -= dt * (b.enrage ? 1.9 : 1);
        if (b.atkCd <= 0) { b.atkCd = rand(2.1, 3.1); bossFire(); }
      }

      // 嘲讽：只冻结马桶，不做别的
      if (mocking) {
        b.taunt -= dt;
        if (b.taunt <= 0) { b.taunt = 0; b.tauntCd = rand(5, 8); }
      } else {
        b.tauntCd -= dt;
        if (b.tauntCd <= 0) {
          b.taunt = 2.4;
          b.tauntText = BOSS_TAUNTS[Math.floor(Math.random() * BOSS_TAUNTS.length)];
          Sound.fart(0.15);          // 短促的嘲笑声，别漏参数
        }
      }

      // 狂暴后定期甩小苍蝇
      if (b.enrage) {
        b.minionCd -= dt;
        if (b.minionCd <= 0) { b.minionCd = rand(7, 10); spawnMinions(2); }
      }
    }
  }

  // Boss 的弹：可被玩家拦截，穿过就被马桶接住
  for (let i = bossShots.length - 1; i >= 0; i--) {
    const s = bossShots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.spin * dt;
    s.trail -= dt;
    if (s.trail <= 0) {
      s.trail = 0.03;
      particles.push({
        x: s.x, y: s.y, vx: rand(-24, 24), vy: rand(-24, 24),
        r: rand(2, 5), life: 0.4, max: 0.4,
        col: 'rgba(120,170,80,0.6)', grav: 160, gas: false, spin: 0, rot: 0
      });
    }

    // 被玩家炮弹打掉
    let gone = false;
    for (let j = shots3.length - 1; j >= 0; j--) {
      const p = shots3[j];
      const dx = p.x - s.x, dy = p.y - s.y, rr = p.r + s.r;
      if (dx * dx + dy * dy <= rr * rr) {
        burst(s.x, s.y, 20, { colors: ['#8fd06a', '#5a8f3c', '#e8f7c8'], spMin: 120, spMax: 440, rMin: 2.4, rMax: 8 });
        score += 50;
        popText(s.x, s.y - 22, '+50 拦截', '#8fd06a', 24);
        shake = Math.max(shake, 8);
        shots3.splice(j, 1);
        gone = true;
        break;
      }
    }
    if (gone) { bossShots.splice(i, 1); continue; }

    // 砸到马桶 → 掉血；砸到别处只是糊一坨
    if (s.y > 430 && Math.abs(s.x - MUZZLE.x) < 196) {
      bossShots.splice(i, 1);
      damagePlayer();
      continue;
    }
    if (s.y > FLOOR - 6) {
      addSplat(s.x, FLOOR, 26, false, 0.6);
      burst(s.x, FLOOR, 16, { colors: ['#8fd06a', '#5a8f3c'], spMin: 80, spMax: 320, rMin: 2.4, rMax: 7 });
      shake = Math.max(shake, 6);
      bossShots.splice(i, 1);
      continue;
    }
    if (s.x < -80 || s.x > W + 80) bossShots.splice(i, 1);
  }
}
/* 打空：不直接清零（弧线打活动靶本来就常常落空），
   而是把连击窗口压到 1.4 秒 —— 够补一记快射，但不够你再蓄一次满力。
   狂射期间豁免，否则连发会自己打断自己。 */
function onMiss() {
  if (frenzy > 0) return;
  if (combo > 0) comboTimer = Math.min(comboTimer, 1.4);
}
function splatShot(p, onFly) {
  if (onFly) {
    burst(p.x, p.y, 22, { spMin: 90, spMax: 400, rMin: 2.4, rMax: 8 });
  } else {
    const squash = p.onWall ? 1.0 : 0.60;
    addSplat(p.x, p.y, p.r * rand(1.35, 1.85), false, squash);
    burst(p.x, p.y, 18, { spMin: 80, spMax: 380, rMin: 2.4, rMax: 8 });
  }
  puff(p.x, p.y, 5);
  Sound.splat();
  shake = Math.max(shake, 5);
}

/* ============================================================
   主更新
   ============================================================ */
function update(dt) {
  const L = Lv();

  if (victoryActive) victoryT += dt;

  if (scene === 'playing') {
    // 狂射模式下蓄力几乎瞬间完成；马桶被冻住时蓄力反而回落
    if (charging) {
      if (toiletFrozen()) {
        chargeT = Math.max(0, chargeT - dt * 1.8);
        wasCharging = false;
      } else {
        chargeT = Math.min(1, chargeT + dt / (frenzy > 0 ? 0.10 : 0.85));
        if (!wasCharging) { wasCharging = true; Sound.charge(); }
      }
    } else wasCharging = false;

    // 狂射计时 + 按住连发
    if (fireCd > 0) fireCd -= dt;
    if (frenzy > 0) {
      frenzy -= dt;
      if (frenzy <= 0) { frenzy = 0; }
      else if (charging && fireCd <= 0) {
        fire(0.72 + Math.random() * 0.28);
        fireCd = FRENZY_RATE;
      }
    }
    frenzyTint += ((frenzy > 0 ? 1 : 0) - frenzyTint) * Math.min(1, dt * 7);

    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0 && frenzy <= 0) combo = 0; }
    elapsed += dt;
    timeLeft -= dt;
    windNow = L.wind * (1 + Math.sin(elapsed * 0.7) * 0.25);

    for (const h of hazards) { h.t += dt; h.x = h.bx + Math.sin(h.t * h.w + h.ph) * h.amp; }

    spawnTimer -= dt;
    if (!L.boss) {
      const maxFlies = Math.min(13, 6 + Math.floor(elapsed / 10));
      if (spawnTimer <= 0 && flies.length < maxFlies) {
        spawnFly();
        spawnTimer = Math.max(0.34, L.spawn - elapsed * 0.010);
      }
    }
    updateBoss(dt);
    if (goalMet()) { finishLevel(true); }
    else if (timeLeft <= 0) { timeLeft = 0; finishLevel(false); }
  }

  updateFlies(dt);

  const GRAV = 1500;
  for (let i = shots3.length - 1; i >= 0; i--) {
    const p = shots3[i];
    p.vy += GRAV * dt;
    p.vx += windNow * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;

    p.trail -= dt;
    if (p.trail <= 0) {
      p.trail = 0.02;
      particles.push({
        x: p.x, y: p.y, vx: rand(-22, 22), vy: rand(-22, 22),
        r: rand(1.6, 4), life: 0.4, max: 0.4,
        col: frenzy > 0 ? 'rgba(226,164,40,0.72)' : 'rgba(125,78,44,0.62)', grav: 300, gas: false, spin: 0, rot: 0
      });
    }

    // 障碍
    let dead = false, hitFlyFlag = false, onWall = false;
    for (const h of hazards) {
      const dx = p.x - h.x, dy = p.y - h.y;
      if (dx * dx + dy * dy < (34 + p.r) * (34 + p.r)) { dead = true; onWall = true; break; }
    }

    if (!dead) {
      for (let j = flies.length - 1; j >= 0; j--) {
        const f = flies[j];
        const dx = f.x - p.x, dy = f.y - p.y;
        const rad = f.r * 0.80 + p.r * 0.85;
        if (dx * dx + dy * dy <= rad * rad) {
          killFly(f); flies.splice(j, 1);
          dead = true; hitFlyFlag = true;
          break;
        }
      }
    }

    // Boss：巨大的判定体
    if (!dead && boss && boss.hp > 0 && bossIntro <= 0) {
      const dx = boss.x - p.x, dy = boss.y - p.y;
      const rad = boss.r * 0.62 + p.r;
      if (dx * dx + dy * dy <= rad * rad) {
        hitBoss(p.power);
        dead = true; hitFlyFlag = true;
      }
    }

    if (!dead) {
      if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx) * 0.58; onWall = true; }
      if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx) * 0.58; onWall = true; }
      if (p.y < p.r) { p.y = p.r; p.vy = Math.abs(p.vy) * 0.58; onWall = true; }
      if (onWall) {
        p.bounces++;
        burst(p.x, p.y, 5, { spMin: 50, spMax: 190, rMin: 2, rMax: 5.5 });
        shake = Math.max(shake, 4);
        if (p.bounces >= 3) dead = true;
      }
    }

    if (p.y > FLOOR - p.r * 0.5) { p.y = FLOOR - p.r * 0.5; dead = true; }

    if (dead) {
      if (!hitFlyFlag) onMiss();
      p.onWall = onWall && !hitFlyFlag;
      splatShot(p, hitFlyFlag);
      shots3.splice(i, 1);
    }
  }

  updateParticles(dt);

  shake = Math.max(0, shake - dt * 40);
  recoil = Math.max(0, recoil - dt * 3.0);
  muzzleGlow = Math.max(0, muzzleGlow - dt * 3.6);
  flash = Math.max(0, flash - dt * 3.6);
  waterRipple = Math.max(0, waterRipple - dt * 1.6);
  aimPulse += dt;
}

/* ============================================================
   巨型苍蝇 Boss
   ============================================================ */
function drawBoss(g, t) {
  const b = boss;
  if (!b) return;
  const R = b.r * 0.62;
  const en = !!b.enrage;

  softShadow(g, b.x + 18, b.y + R * 2.0, R * 1.6, R * 0.55, 0.30, '30,50,62');

  g.save();
  g.translate(b.x, b.y);
  const intro = bossIntro > 0 ? clamp(1 - bossIntro / 1.6, 0, 1) : 1;
  g.scale(intro, intro);
  g.rotate(Math.sin(b.t * 1.2) * 0.05);

  const dark = en ? '#3a1210' : '#161c20';
  const body = en ? '#7a2f1f' : '#39434a';
  const lite = en ? '#cc5a3c' : '#707f89';

  // 腹部
  g.beginPath();
  g.ellipse(0, R * 0.62, R * 0.86, R * 1.05, 0, 0, TAU);
  const ab = g.createLinearGradient(-R, 0, R, 0);
  ab.addColorStop(0, lite); ab.addColorStop(0.5, body); ab.addColorStop(1, dark);
  g.fillStyle = ab; g.fill();
  g.strokeStyle = dark; g.lineWidth = 4; g.stroke();
  g.save();
  g.beginPath(); g.ellipse(0, R * 0.62, R * 0.86, R * 1.05, 0, 0, TAU); g.clip();
  g.strokeStyle = 'rgba(0,0,0,0.30)'; g.lineWidth = 7;
  for (let i = -2; i <= 3; i++) {
    g.beginPath(); g.moveTo(-R, R * 0.62 + i * R * 0.42); g.lineTo(R, R * 0.62 + i * R * 0.42); g.stroke();
  }
  g.beginPath(); g.ellipse(-R * 0.30, R * 0.30, R * 0.24, R * 0.62, -0.3, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.15)'; g.fill();
  g.restore();

  // 四翅
  const flap = Math.sin(b.wing) * 0.5 + 0.5;
  for (const s of [-1, 1]) {
    for (let k = 0; k < 2; k++) {
      g.save();
      g.translate(s * R * 0.26, -R * 0.74 + k * R * 0.28);
      g.rotate(s * (-0.30 + flap * 0.55 - k * 0.18));
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(s * R * 0.95, -R * 0.62, s * R * 1.65, -R * 0.30, s * R * 1.95, R * 0.12);
      g.bezierCurveTo(s * R * 1.45, R * 0.36, s * R * 0.7, R * 0.34, 0, 0);
      g.closePath();
      const wg = g.createLinearGradient(0, 0, s * R * 1.95, 0);
      wg.addColorStop(0, 'rgba(222,242,252,0.46)');
      wg.addColorStop(1, 'rgba(146,194,220,0.18)');
      g.fillStyle = wg; g.fill();
      g.strokeStyle = 'rgba(108,148,174,0.45)'; g.lineWidth = 2; g.stroke();
      g.restore();
    }
  }

  // 六足
  g.strokeStyle = dark; g.lineWidth = 7; g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    for (const s of [-1, 1]) {
      const by = -R * 0.30 + i * R * 0.52;
      g.beginPath();
      g.moveTo(s * R * 0.5, by);
      g.quadraticCurveTo(s * R * 1.6, by + R * 0.36, s * R * 1.35, by + R * 1.35);
      g.stroke();
    }
  }

  // 胸腔
  g.beginPath();
  g.ellipse(0, -R * 0.42, R * 0.76, R * 0.72, 0, 0, TAU);
  const th = g.createLinearGradient(-R * 0.8, -R, R * 0.8, R * 0.3);
  th.addColorStop(0, lite); th.addColorStop(0.55, body); th.addColorStop(1, dark);
  g.fillStyle = th; g.fill();
  g.strokeStyle = dark; g.lineWidth = 4; g.stroke();

  // 头
  g.beginPath();
  g.ellipse(0, -R * 1.16, R * 0.66, R * 0.56, 0, 0, TAU);
  g.fillStyle = dark; g.fill();

  // 复眼（发光）—— 嘲讽时换成得意的眯眼笑
  const mocking = b.taunt > 0;
  if (mocking) {
    g.strokeStyle = '#ffd9c9'; g.lineWidth = 9; g.lineCap = 'round';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.arc(s * R * 0.34, -R * 1.14, R * 0.36, Math.PI * 1.06, Math.PI * 1.94);
      g.stroke();
    }
    // 脸颊红晕
    for (const s of [-1, 1]) {
      const bg3 = g.createRadialGradient(s * R * 0.66, -R * 0.86, 1, s * R * 0.66, -R * 0.86, R * 0.30);
      bg3.addColorStop(0, 'rgba(255,120,110,0.55)');
      bg3.addColorStop(1, 'rgba(255,120,110,0)');
      g.fillStyle = bg3;
      g.beginPath(); g.arc(s * R * 0.66, -R * 0.86, R * 0.30, 0, TAU); g.fill();
    }
  } else {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.ellipse(s * R * 0.34, -R * 1.24, R * 0.34, R * 0.44, s * 0.25, 0, TAU);
      const eg = g.createRadialGradient(s * R * 0.26, -R * 1.38, 1, s * R * 0.34, -R * 1.24, R * 0.52);
      eg.addColorStop(0, en ? '#ff9a7a' : '#ff5a4a');
      eg.addColorStop(0.5, en ? '#c22a12' : '#a01c14');
      eg.addColorStop(1, '#38060a');
      g.fillStyle = eg; g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 2; g.stroke();
      g.beginPath(); g.arc(s * R * 0.26, -R * 1.44, R * 0.09, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,0.9)'; g.fill();
    }
    // 怒眉
    g.strokeStyle = en ? '#ffb09a' : '#000'; g.lineWidth = 8; g.lineCap = 'round';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * R * 0.10, -R * 1.64);
      g.lineTo(s * R * 0.62, -R * 1.46);
      g.stroke();
    }
  }
  if (mocking) {
    // 得意的咧嘴 + 吐舌头
    g.beginPath();
    g.arc(0, -R * 0.92, R * 0.46, Math.PI * 0.10, Math.PI * 0.90);
    g.strokeStyle = '#ffb09a'; g.lineWidth = 9; g.lineCap = 'round';
    g.stroke();
    g.beginPath();
    g.ellipse(0, -R * 0.74, R * 0.17, R * 0.24, 0, 0, TAU);
    g.fillStyle = '#e0596f'; g.fill();
    g.strokeStyle = '#8d2740'; g.lineWidth = 2.5; g.stroke();
  } else {
    // 口器
    g.strokeStyle = '#12171a'; g.lineWidth = 8;
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * R * 0.18, -R * 0.92);
      g.quadraticCurveTo(s * R * 0.44, -R * 0.66, s * R * 0.26, -R * 0.48);
      g.stroke();
    }
  }

  // 嘲讽气泡（注意：这里仍在 Boss 的 translate/scale 变换里，必须用局部坐标）
  if (b.taunt > 0 && b.tauntText) {
    const pop = clamp((2.4 - b.taunt) / 0.18, 0, 1);       // 弹出
    const fade = clamp(b.taunt / 0.4, 0, 1);               // 收尾淡出
    g.save();
    g.globalAlpha = Math.min(pop, fade);
    g.textAlign = 'center';
    g.font = '800 21px "Segoe UI","Microsoft YaHei",sans-serif';
    const tw = g.measureText(b.tauntText).width;
    const pw = tw + 34, phh = 42;
    g.translate(0, R * 1.55 + (1 - pop) * 10);
    g.scale(pop, pop);
    rr(g, -pw / 2, 0, pw, phh, 12);
    const bg = g.createLinearGradient(0, 0, 0, phh);
    bg.addColorStop(0, '#fffdf2'); bg.addColorStop(1, '#ffe9b8');
    g.fillStyle = bg; g.fill();
    g.strokeStyle = '#b8892f'; g.lineWidth = 3; g.stroke();
    // 小尾巴朝上指着 Boss
    g.beginPath();
    g.moveTo(-11, 2); g.lineTo(0, -15); g.lineTo(11, 2);
    g.closePath();
    g.fillStyle = '#ffe9b8'; g.fill();
    g.strokeStyle = '#b8892f'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#4a3410';
    g.fillText(b.tauntText, 0, phh / 2 + 8);
    g.restore();
  }

  // 受击白闪
  if (b.hurt > 0.01 || bossFlash > 0.01) {
    const k = Math.max(b.hurt, bossFlash);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = k * 0.22;
    g.beginPath(); g.ellipse(0, 0, R * 1.35, R * 1.65, 0, 0, TAU);
    g.fillStyle = '#ffffff'; g.fill();
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }
  g.restore();

  // 狂暴光环
  if (en) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const ag = g.createRadialGradient(b.x, b.y, R * 0.8, b.x, b.y, R * 2.8);
    ag.addColorStop(0, 'rgba(255,80,40,' + (0.16 + 0.10 * Math.sin(t * 7)) + ')');
    ag.addColorStop(1, 'rgba(255,80,40,0)');
    g.fillStyle = ag;
    g.beginPath(); g.arc(b.x, b.y, R * 2.8, 0, TAU); g.fill();
    g.restore();
  }
}
/* 嘲讽期间马桶被冻住：冰蓝罩子 + 冰棱 + 霜点 */
function drawFrozenToilet(g, t) {
  if (!toiletFrozen()) return;
  const cx = MUZZLE.x, cy = 400;
  g.save();
  const fg = g.createRadialGradient(cx, cy - 60, 40, cx, cy - 20, 320);
  fg.addColorStop(0, 'rgba(158,224,255,0.34)');
  fg.addColorStop(0.6, 'rgba(130,205,255,0.16)');
  fg.addColorStop(1, 'rgba(120,200,255,0.02)');
  g.fillStyle = fg;
  g.beginPath(); g.ellipse(cx, cy - 10, 260, 240, 0, 0, TAU); g.fill();

  // 轮廓上的冰棱
  g.strokeStyle = 'rgba(226,248,255,0.8)';
  g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * TAU + Math.sin(t * 0.8 + i) * 0.05;
    const x = cx + Math.cos(a) * 232;
    const y = cy - 10 + Math.sin(a) * 212;
    const len = 15 + (i % 3) * 9;
    for (let k = 0; k < 3; k++) {
      const ang = a + Math.PI + (k - 1) * 0.85;
      g.beginPath(); g.moveTo(x, y);
      g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      g.stroke();
    }
  }
  // 霜点
  for (let i = 0; i < 9; i++) {
    const ph = t * 2.2 + i * 1.7;
    const x = cx + Math.sin(ph * 0.7) * 205;
    const y = cy - 10 + Math.cos(ph * 0.9) * 180;
    const al = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(ph * 3));
    g.beginPath(); g.arc(x, y, 2.6, 0, TAU);
    g.fillStyle = 'rgba(238,251,255,' + al + ')'; g.fill();
  }
  g.restore();
}
function drawBossShots(g) {

function heartPath(g, cx, cy, r) {
  g.beginPath();
  g.moveTo(cx, cy + r * 0.78);
  g.bezierCurveTo(cx - r * 1.55, cy - r * 0.34, cx - r * 0.56, cy - r * 1.28, cx, cy - r * 0.34);
  g.bezierCurveTo(cx + r * 0.56, cy - r * 1.28, cx + r * 1.55, cy - r * 0.34, cx, cy + r * 0.78);
  g.closePath();
}
function drawHearts(g) {
  const r = 14, x0 = 36, y0 = H - 112;
  for (let i = 0; i < PLAYER_HP; i++) {
    const x = x0 + i * 38, y = y0;
    heartPath(g, x, y, r);
    if (i < playerHP) {
      const hg = g.createLinearGradient(0, y - r, 0, y + r);
      hg.addColorStop(0, '#ff7a6a'); hg.addColorStop(1, '#c0392b');
      g.fillStyle = hg; g.fill();
      g.strokeStyle = '#7d1d13'; g.lineWidth = 2; g.stroke();

      g.fillStyle = 'rgba(255,255,255,0.75)'; g.fill();
    } else {
      g.fillStyle = 'rgba(20,30,36,0.5)'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2; g.stroke();

function drawBossBar(g) {

  g.fillText('🐛 巨 型 苍 蝇' + (boss.enrage ? '   ·   狂 暴 化' : ''), W / 2, by - 12);

  rr(g, bx, by, bw, bh, 13);

  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2.5;

  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5;

  }
  g.font = '800 14px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.fillText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, W / 2, by + bh + 20);
}

/* ============================================================
   马桶 —— 精细矢量
   ============================================================ */
function drawToilet(g, t) {
  const baseY = FLOOR;
  const sq = recoil;                      // 挤压拉伸
  const tilt = Math.sin(recoil * Math.PI) * 0.05;
  g.save();
  g.translate(MUZZLE.x, baseY);
  g.rotate(tilt);
  g.scale(1 + sq * 0.06, 1 - sq * 0.075);

  const line = 'rgba(146,175,190,0.85)';

  // 地面接触阴影
  softShadow(g, 0, 6, 200, 26, 0.34, '46,68,82');

  /* ---------- 水箱 ---------- */
  const tankTop = -318, tankBot = -150, tankW = 116;
  rr(g, -tankW, tankTop, tankW * 2, tankBot - tankTop, 18);
  const tankG = g.createLinearGradient(-tankW, 0, tankW, 0);
  tankG.addColorStop(0, '#e8eff3');
  tankG.addColorStop(0.20, '#ffffff');
  tankG.addColorStop(0.62, '#f4f8fa');
  tankG.addColorStop(1, '#c9d7de');
  g.fillStyle = tankG; g.fill();
  g.strokeStyle = line; g.lineWidth = 2.6; g.stroke();

  // 水箱盖
  rr(g, -tankW - 14, tankTop - 22, tankW * 2 + 28, 26, 10);
  const lidG = g.createLinearGradient(0, tankTop - 22, 0, tankTop + 4);
  lidG.addColorStop(0, '#ffffff'); lidG.addColorStop(1, '#dfe8ed');
  g.fillStyle = lidG; g.fill();
  g.strokeStyle = line; g.lineWidth = 2.6; g.stroke();
  // 盖子高光
  g.beginPath();
  g.moveTo(-tankW - 6, tankTop - 19);
  g.lineTo(tankW * 0.1, tankTop - 19);
  g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 3; g.stroke();

  // 冲水按钮
  const press = Math.sin(recoil * Math.PI) * 6;
  g.beginPath();
  g.ellipse(-58, tankTop - 9 + press, 21, 9, 0, 0, TAU);
  const btnG = g.createLinearGradient(0, tankTop - 18, 0, tankTop);
  btnG.addColorStop(0, '#f3f7f9'); btnG.addColorStop(1, '#c2cfd6');
  g.fillStyle = btnG; g.fill();
  g.strokeStyle = 'rgba(150,175,190,0.8)'; g.lineWidth = 2; g.stroke();

  // 冲水扳手
  g.save();
  g.translate(tankW + 4, -246);
  g.rotate(recoil * 1.1);
  rr(g, -6, -7, 40, 15, 7);
  const hg = g.createLinearGradient(0, -7, 0, 8);
  hg.addColorStop(0, '#f0f5f8'); hg.addColorStop(0.5, '#cfdae0'); hg.addColorStop(1, '#a8b8c1');
  g.fillStyle = hg; g.fill();
  g.strokeStyle = 'rgba(140,165,180,0.85)'; g.lineWidth = 2; g.stroke();
  g.restore();

  // 水箱装饰线与高光
  g.beginPath(); g.moveTo(-tankW + 26, -176); g.lineTo(tankW - 26, -176);
  g.strokeStyle = 'rgba(180,200,212,0.7)'; g.lineWidth = 2; g.stroke();
  g.beginPath();
  g.moveTo(-tankW + 22, tankBot - 14);
  g.lineTo(-tankW + 22, tankTop + 22);
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 7; g.lineCap = 'round';
  g.stroke();

  /* ---------- 盆体 ---------- */
  const rimY = -140, rimRX = 190;
  g.beginPath();
  g.moveTo(-186, rimY + 10);
  g.bezierCurveTo(-198, rimY + 62, -168, rimY + 100, -104, rimY + 110);
  g.lineTo(104, rimY + 110);
  g.bezierCurveTo(168, rimY + 100, 198, rimY + 62, 186, rimY + 10);
  g.closePath();
  const bowlG = g.createLinearGradient(-200, rimY, 200, rimY + 115);
  bowlG.addColorStop(0, '#dbe5ea');
  bowlG.addColorStop(0.18, '#ffffff');
  bowlG.addColorStop(0.55, '#f7fafc');
  bowlG.addColorStop(1, '#c6d5dd');
  g.fillStyle = bowlG; g.fill();
  g.strokeStyle = line; g.lineWidth = 3; g.stroke();

  // 盆体左侧高光
  g.save();
  g.beginPath();
  g.moveTo(-186, rimY + 10);
  g.bezierCurveTo(-198, rimY + 62, -168, rimY + 100, -104, rimY + 110);
  g.lineTo(104, rimY + 110);
  g.bezierCurveTo(168, rimY + 100, 198, rimY + 62, 186, rimY + 10);
  g.closePath();
  g.clip();
  g.beginPath();
  g.moveTo(-158, rimY + 18);
  g.bezierCurveTo(-168, rimY + 66, -142, rimY + 94, -96, rimY + 104);
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 13; g.lineCap = 'round';
  g.stroke();
  g.restore();

  // 底座
  g.beginPath();
  g.moveTo(-104, rimY + 110);
  g.bezierCurveTo(-118, rimY + 118, -124, rimY + 132, -118, rimY + 140);
  g.lineTo(118, rimY + 140);
  g.bezierCurveTo(124, rimY + 132, 118, rimY + 118, 104, rimY + 110);
  g.closePath();
  const pedG = g.createLinearGradient(-120, 0, 120, 0);
  pedG.addColorStop(0, '#cfdae1'); pedG.addColorStop(0.4, '#f2f7f9'); pedG.addColorStop(1, '#bccbd4');
  g.fillStyle = pedG; g.fill();
  g.strokeStyle = line; g.lineWidth = 2.4; g.stroke();

  /* ---------- 马桶圈 ---------- */
  g.beginPath();
  g.ellipse(0, rimY, rimRX, 48, 0, 0, TAU);
  const seatG = g.createLinearGradient(0, rimY - 48, 0, rimY + 48);
  seatG.addColorStop(0, '#ffffff');
  seatG.addColorStop(0.5, '#f2f7f9');
  seatG.addColorStop(1, '#cfdbe2');
  g.fillStyle = seatG; g.fill();
  g.strokeStyle = line; g.lineWidth = 2.8; g.stroke();
  // 圈的厚度感
  g.beginPath();
  g.ellipse(0, rimY + 5, rimRX - 4, 43, 0, 0, Math.PI);
  g.strokeStyle = 'rgba(170,195,208,0.55)'; g.lineWidth = 2.4; g.stroke();

  /* ---------- 便盆内腔 ---------- */
  g.beginPath();
  g.ellipse(0, rimY, 152, 34, 0, 0, TAU);
  const cav = g.createLinearGradient(0, rimY - 34, 0, rimY + 34);
  cav.addColorStop(0, '#5b6b74');
  cav.addColorStop(0.45, '#2c3840');
  cav.addColorStop(1, '#131a1f');
  g.fillStyle = cav; g.fill();
  g.strokeStyle = 'rgba(150,178,192,0.75)'; g.lineWidth = 2.4; g.stroke();

  // 内壁受光（左上）
  g.save();
  g.beginPath(); g.ellipse(0, rimY, 152, 34, 0, 0, TAU); g.clip();
  const inner2 = g.createLinearGradient(-140, rimY - 30, 40, rimY + 10);
  inner2.addColorStop(0, 'rgba(190,214,226,0.42)');
  inner2.addColorStop(0.55, 'rgba(190,214,226,0)');
  g.fillStyle = inner2;
  g.fillRect(-160, rimY - 40, 320, 80);
  g.restore();

  /* ---------- 水面 ---------- */
  g.save();
  g.beginPath();
  g.ellipse(0, rimY + 4, 106, 19, 0, 0, TAU);
  g.clip();
  const ft = frenzyTint;
  const mixc = (a, b) => 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * ft) + ',' +
    Math.round(a[1] + (b[1] - a[1]) * ft) + ',' + Math.round(a[2] + (b[2] - a[2]) * ft) + ')';
  const wg = g.createLinearGradient(0, rimY - 20, 0, rimY + 26);
  wg.addColorStop(0, mixc([77, 149, 174], [232, 176, 48]));
  wg.addColorStop(0.5, mixc([48, 112, 138], [186, 126, 20]));
  wg.addColorStop(1, mixc([26, 75, 94], [110, 68, 6]));
  g.fillStyle = wg;
  g.fillRect(-112, rimY - 24, 224, 52);
  // 涟漪
  for (let i = 0; i < 3; i++) {
    const ph = (t * (1.1 + i * 0.5) + i * 2.1) % 1;
    g.beginPath();
    g.ellipse(0, rimY + 4, 34 + ph * 96, 6 + ph * 17, 0, 0, TAU);
    g.strokeStyle = 'rgba(190,232,244,' + (0.30 * (1 - ph)) + ')';
    g.lineWidth = 2.2;
    g.stroke();
  }
  // 开炮时的水花
  if (waterRipple > 0.01) {
    g.beginPath();
    g.ellipse(0, rimY + 4, 40 + (1 - waterRipple) * 90, 8 + (1 - waterRipple) * 18, 0, 0, TAU);
    g.strokeStyle = 'rgba(210,240,250,' + (waterRipple * 0.75) + ')';
    g.lineWidth = 3.4;
    g.stroke();
  }
  g.restore();

  // 水面高光
  g.beginPath();
  g.ellipse(-30, rimY - 1, 54, 8, 0.05, 0, TAU);
  g.fillStyle = 'rgba(180,230,246,0.34)';
  g.fill();

  /* ---------- 炮口辉光 ---------- */
  if (muzzleGlow > 0.01) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const gl = g.createRadialGradient(0, rimY, 6, 0, rimY, 180);
    gl.addColorStop(0, 'rgba(255,226,160,' + (muzzleGlow * 0.85) + ')');
    gl.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = gl;
    g.beginPath(); g.arc(0, rimY, 180, 0, TAU); g.fill();
    g.restore();
  }

  // 商标
  g.save();
  g.globalAlpha = 0.5;
  g.font = '700 17px "Segoe UI","Microsoft YaHei",sans-serif';
  g.fillStyle = '#7d95a3';
  g.textAlign = 'center';
  g.fillText('WC-2000', 0, -72);
  g.restore();

  g.restore();
}

/* ============================================================
   卷纸障碍
   ============================================================ */
function drawHazard(g, h, t) {
  // 吊绳
  g.strokeStyle = 'rgba(122,136,144,0.8)';
  g.lineWidth = 2.4;
  g.beginPath();
  g.moveTo(h.bx + Math.sin(h.t * h.w + h.ph) * h.amp * 0.15, -10);
  g.lineTo(h.x, h.y - 32);
  g.stroke();
  softShadow(g, h.x, h.y + 34, 44, 12, 0.18);
  // 纸筒
  g.save();
  g.translate(h.x, h.y);
  g.rotate(Math.sin(h.t * h.w + h.ph) * 0.12);
  const grd = g.createLinearGradient(-30, 0, 30, 0);
  grd.addColorStop(0, '#c9d6dd');
  grd.addColorStop(0.34, '#ffffff');
  grd.addColorStop(1, '#dde7ec');
  g.beginPath(); g.ellipse(0, 0, 31, 36, 0, 0, TAU);
  g.fillStyle = grd; g.fill();
  g.strokeStyle = 'rgba(160,186,200,0.9)'; g.lineWidth = 2.4; g.stroke();
  // 纸卷端面螺旋
  g.beginPath(); g.ellipse(0, 0, 11, 13, 0, 0, TAU);
  g.fillStyle = '#e9f0f4'; g.fill();
  g.strokeStyle = 'rgba(170,195,208,0.9)'; g.lineWidth = 2; g.stroke();
  g.beginPath();
  g.arc(0, 0, 20, -0.6, 2.4);
  g.strokeStyle = 'rgba(180,205,218,0.8)'; g.lineWidth = 2; g.stroke();
  // 垂下的纸
  g.beginPath();
  g.moveTo(26, 16);
  g.bezierCurveTo(48, 52, 42, 96, 34, 128);
  g.lineTo(2, 120);
  g.bezierCurveTo(12, 90, 12, 50, 4, 20);
  g.closePath();
  g.fillStyle = '#ffffff'; g.fill();
  g.strokeStyle = 'rgba(200,218,228,0.95)'; g.lineWidth = 2; g.stroke();
  g.restore();
}

/* ============================================================
   渲染
   ============================================================ */
let hitRects = [];
const addHit = (x, y, w, h, action) => hitRects.push({ x, y, w, h, action });

/* 光标：只有进游戏才藏起系统指针（那时画自绘准星），
   菜单/选关必须看得见鼠标，悬停可点元素时变手型。 */
let lastCursor = '';
function updateCursor() {
  let want = 'default';
  if (scene === 'playing') {
    want = 'none';
  } else {
    for (const r of hitRects) {
      if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
        want = 'pointer';
        break;
      }
    }
  }
  if (want !== lastCursor) {
    cvs.style.cursor = want;
    lastCursor = want;
  }
}

function render(t) {
  const g = ctx;
  hitRects = [];
  g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  g.fillStyle = '#080d11';
  g.fillRect(0, 0, cvs.width / view.dpr, cvs.height / view.dpr);
  g.translate(view.ox, view.oy);
  g.scale(view.scale, view.scale);

  g.save();
  if (shake > 0.3) g.translate(rand(-shake, shake), rand(-shake, shake));

  // 轻微的相机视差：准星越偏，场景反向偏移一点，产生纵深
  const par = scene === 'playing' ? 1 : 0;
  const px2 = (mouse.x - W / 2) / (W / 2) * -9 * par;
  const py2 = (mouse.y - H / 2) / (H / 2) * -6 * par;
  g.translate(px2, py2);

  g.drawImage(bg, 0, 0);
  g.drawImage(decal, 0, 0);

  // 镜面反射：把动态物体按镜心竖直翻转，画进镜内
  drawMirror(g, t);

  // 苍蝇（含墙上柔影）
  for (const f of flies) {
    softShadow(g, f.x + 8, f.y + f.r * 0.7, f.r * 1.0, f.r * 0.62, 0.18, '30,50,62');
    drawFly(g, f);
  }

  // 马桶先画；瞄准线和炮弹必须压在它上面，否则弹道起点会被盆体吃掉
  if (goldSkin) {
    glctx.setTransform(1, 0, 0, 1, 0, 0);
    glctx.clearRect(0, 0, 480, 400);
    glctx.save();
    glctx.translate(-GOLD_LX, -GOLD_LY);
    drawToilet(glctx, t);
    glctx.restore();
    glctx.globalCompositeOperation = 'source-atop';
    const gg = glctx.createLinearGradient(0, 0, 480, 400);
    gg.addColorStop(0.00, '#fff3bd');
    gg.addColorStop(0.18, '#f7d24a');
    gg.addColorStop(0.42, '#e0ac1c');
    gg.addColorStop(0.68, '#b07d08');
    gg.addColorStop(1.00, '#6d4d03');
    glctx.globalAlpha = 0.86;
    glctx.fillStyle = gg;
    glctx.fillRect(0, 0, 480, 400);
    glctx.globalAlpha = 0.30;
    const shg = glctx.createLinearGradient(0, 400, 480, 0);
    shg.addColorStop(0, 'rgba(255,255,255,0)');
    shg.addColorStop(0.45, 'rgba(255,255,255,0.9)');
    shg.addColorStop(0.62, 'rgba(255,255,255,0.2)');
    shg.addColorStop(1, 'rgba(255,255,255,0)');
    glctx.fillStyle = shg;
    glctx.fillRect(0, 0, 480, 400);
    glctx.globalAlpha = 1;
    glctx.globalCompositeOperation = 'source-over';
    g.drawImage(goldLayer, GOLD_LX, GOLD_LY);
  } else {
    drawToilet(g, t);
  }

  // 卷纸障碍画在马桶「之后」—— 它们在马桶前面晃，
  // 荡到中间时必须是卷纸压住马桶，而不是被马桶盖住。
  for (const h of hazards) drawHazard(g, h, t);

  drawFrozenToilet(g, t);

  if (scene === 'playing') drawAim(g);

  if (boss) drawBoss(g, t);
  drawBossShots(g);

  for (const p of shots3) {
    const v = Math.hypot(p.vx, p.vy);
    const stretch = clamp(1 + v / 2600, 1, 1.30);
    // 空中柔影
    softShadow(g, p.x + 10, p.y + p.r * 1.6, p.r * 1.5, p.r * 0.9, 0.16, '30,50,62');
    drawPoop(g, p.x, p.y, p.r, p.rot, stretch);
  }

  // 粒子
  for (const p of particles) {
    const a = p.gas ? (p.life / p.max) * 0.5 : Math.min(1, p.life / p.max * 1.7);
    g.globalAlpha = a;
    if (p.gas) {
      const gg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      gg.addColorStop(0, 'rgba(240,246,249,0.75)');
      gg.addColorStop(1, 'rgba(240,246,249,0)');
      g.fillStyle = gg;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
    } else {
      g.save();
      g.translate(p.x, p.y);
      g.rotate(p.rot);
      g.fillStyle = p.col;
      const rr2 = p.r * Math.min(1, p.life / p.max * 1.5 + 0.45);
      g.beginPath();
      g.ellipse(0, 0, rr2, rr2 * 0.86, 0, 0, TAU);
      g.fill();
      g.restore();
    }
  }
  g.globalAlpha = 1;

  // 飘字
  g.textAlign = 'center';
  for (const q of pops) {
    const pr = q.life / q.max;
    g.globalAlpha = Math.min(1, pr * 2.0);
    g.font = '800 ' + q.size + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    g.lineWidth = 6;
    g.strokeStyle = 'rgba(16,26,32,0.7)';
    g.strokeText(q.text, q.x, q.y);
    g.fillStyle = q.color;
    g.fillText(q.text, q.x, q.y);
  }
  g.globalAlpha = 1;
  g.restore();

  // 颗粒 + 闪光
  g.globalAlpha = 1;
  g.drawImage(grain, 0, 0);

  // 狂射模式：金色氛围 + 呼吸脉动
  if (frenzyTint > 0.01) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 9);
    g.save();
    const fg = g.createRadialGradient(640, 360, 180, 640, 360, 860);
    fg.addColorStop(0, 'rgba(255,190,60,0)');
    fg.addColorStop(1, 'rgba(255,166,30,' + (0.32 * frenzyTint * (0.7 + pulse * 0.3)) + ')');
    g.fillStyle = fg;
    g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = frenzyTint * 0.10 * (0.6 + pulse * 0.4);
    g.fillStyle = '#ffb43c';
    g.fillRect(0, 0, W, H);
    g.restore();
  }

  if (flash > 0) {
    g.fillStyle = 'rgba(' + flashColor + ',' + (flash * 0.30) + ')';
    g.fillRect(0, 0, W, H);
  }

  // 准星
  if (scene === 'playing') drawCrosshair(g);

  if (scene === 'playing') drawHUD(g);
  else if (scene === 'menu') drawMenu(g);
  else if (scene === 'select') drawSelect(g);
  else if (scene === 'clear') {
    // 通关动画先播，播完再淡入结算面板
    if (victoryActive) {
      drawVictory(g, t);
      if (victoryT > V_END) {
        g.globalAlpha = clamp((victoryT - V_END) / 0.5, 0, 1);
        drawClear(g);
        g.globalAlpha = 1;
      }
    } else drawClear(g);
  }
  else if (scene === 'fail') drawFail(g);

  updateCursor();
}

function drawMirror(g, t) {
  const mx = 838, my = 116, mw = 292, mh = 236;
  g.save();
  rr(g, mx, my, mw, mh, 6);
  g.clip();
  // 玻璃底色
  const gl = g.createLinearGradient(mx, my, mx + mw, my + mh);
  gl.addColorStop(0, '#dceaf2'); gl.addColorStop(0.5, '#eef7fc'); gl.addColorStop(1, '#c7dbe7');
  g.fillStyle = gl;
  g.fillRect(mx, my, mw, mh);
  /* 倒影：镜子在后墙上，镜面翻转的是「深度」而不是上下。
     平面投影里深度不可见，但透视仍然成立 —— 倒影应该被压向消失点：
     物体往上飞，倒影也往上；物体往右飞，倒影也往右。
     （之前按镜心竖直翻转，等于把镜子装在了地板上，方向正好相反。） */
  g.globalAlpha = 0.40;
  g.save();
  g.beginPath(); g.rect(mx, my, mw, mh); g.clip();
  for (const f of flies) {
    g.save();
    g.translate(VP.x, VP.y); g.scale(MIRROR_K, MIRROR_K); g.translate(-VP.x, -VP.y);
    drawFly(g, f);
    g.restore();
  }
  for (const p of shots3) {
    const rx = VP.x + (p.x - VP.x) * MIRROR_K;
    const ry = VP.y + (p.y - VP.y) * MIRROR_K;
    drawPoop(g, rx, ry, p.r * MIRROR_K, p.rot, 1);
  }
  g.restore();
  g.globalAlpha = 1;
  // 玻璃斜向高光
  const sheen = g.createLinearGradient(mx, my + mh, mx + mw, my);
  sheen.addColorStop(0, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.42, 'rgba(255,255,255,0.30)');
  sheen.addColorStop(0.55, 'rgba(255,255,255,0.10)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen;
  g.fillRect(mx, my, mw, mh);
  g.restore();
  // 内框
  rr(g, mx, my, mw, mh, 6);
  g.strokeStyle = 'rgba(150,180,198,0.8)'; g.lineWidth = 3; g.stroke();
}

function drawAim(g) {
  const power = charging ? chargeT : 0;
  const sp = chargeSpeed(power);
  let x = MUZZLE.x + Math.cos(aim) * 48;
  let y = MUZZLE.y + Math.sin(aim) * 48;
  let vx = Math.cos(aim) * sp, vy = Math.sin(aim) * sp;
  const dt = 1 / 60;
  const hot = power > 0.85;
  g.save();
  for (let i = 0; i < 74; i++) {
    vy += 1500 * dt;
    vx += windNow * dt;
    x += vx * dt; y += vy * dt;
    if (y > FLOOR || x < 0 || x > W) break;
    if (i % 3 !== 0) continue;
    const a = 1 - i / 74;
    g.globalAlpha = a * 0.85;
    g.fillStyle = hot ? '#ffcf3d' : '#7d4e2b';
    g.beginPath();
    g.arc(x, y, Math.max(1.1, 4.2 - i * 0.035), 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
  // 炮口指向箭头
  g.save();
  g.translate(MUZZLE.x, MUZZLE.y);
  g.rotate(aim);
  const pulse = 1 + Math.sin(aimPulse * 6) * 0.05;
  g.scale(pulse, pulse);
  poly(g, [104, 0, 68, -19, 68, 19]);
  const ag = g.createLinearGradient(60, 0, 104, 0);
  if (hot) { ag.addColorStop(0, 'rgba(255,207,61,0.35)'); ag.addColorStop(1, 'rgba(255,207,61,0.98)'); }
  else { ag.addColorStop(0, 'rgba(125,78,43,0.4)'); ag.addColorStop(1, 'rgba(125,78,43,0.95)'); }
  g.fillStyle = ag;
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.6; g.stroke();
  g.restore();
  g.restore();
}

function drawCrosshair(g) {
  const x = mouse.x, y = mouse.y;
  const fr = frenzy > 0;
  const r = (fr ? 20 : (charging ? 13 + chargeT * 7 : 15)) + (fr ? Math.sin(aimPulse * 14) * 2 : 0);
  g.save();
  g.globalAlpha = 0.92;
  g.strokeStyle = fr ? 'rgba(255,196,60,0.98)'
    : (charging && chargeT >= 1 ? 'rgba(255,207,61,0.95)' : 'rgba(255,255,255,0.85)');
  g.lineWidth = fr ? 2.6 : 2;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
  g.beginPath();
  g.moveTo(x - r - 9, y); g.lineTo(x - r + 2, y);
  g.moveTo(x + r - 2, y); g.lineTo(x + r + 9, y);
  g.moveTo(x, y - r - 9); g.lineTo(x, y - r + 2);
  g.moveTo(x, y + r - 2); g.lineTo(x, y + r + 9);
  g.stroke();
  if (fr) {
    g.beginPath(); g.arc(x, y, r + 7, 0, TAU);
    g.strokeStyle = 'rgba(255,160,40,0.55)'; g.lineWidth = 1.6; g.stroke();
  }
  g.beginPath(); g.arc(x, y, 1.8, 0, TAU);
  g.fillStyle = fr ? '#ffd23d' : 'rgba(255,255,255,0.9)'; g.fill();
  g.restore();
}
